<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<title>הפורטל האישי — אחיטוב תכנון פיננסי</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#F4F6F7;--card:#fff;--ink:#12232B;--mut:#5C6E77;--line:#DDE4E7;--brand:#007DA8}
  body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 22px 80px}
  header{margin-bottom:26px}
  h1{font-size:1.85rem;font-weight:800;letter-spacing:-.01em}
  .sub{color:var(--mut);font-size:.95rem;margin-top:4px}
  .searchbox{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 12px;margin-bottom:6px}
  input[type=search]{width:100%;padding:15px 18px;font-family:inherit;font-size:1.05rem;
    border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  input[type=search]:focus{outline:none;border-color:var(--brand)}
  .count{color:var(--mut);font-size:.85rem;margin:6px 2px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    display:flex;flex-direction:column;gap:7px;text-decoration:none;color:inherit;transition:.13s}
  a.card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,125,168,.10)}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .z{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:5px;color:#fff;white-space:nowrap}
  .ty{font-size:.72rem;color:var(--mut);font-weight:500}
  .nm{font-weight:700;font-size:1.02rem;line-height:1.35}
  .meta{font-size:.82rem;color:var(--mut)}
  .meta b{font-weight:600;color:#3D525C}
  .pathrow{display:flex;align-items:center;gap:8px;margin-top:2px}
  .path{flex:1;font-size:.76rem;color:var(--mut);direction:ltr;text-align:left;
    unicode-bidi:plaintext;word-break:break-all;line-height:1.4}
  .copy{flex:0 0 auto;font-family:inherit;font-size:.76rem;font-weight:600;cursor:pointer;
    color:var(--brand);background:none;border:1.5px solid var(--line);border-radius:7px;
    padding:5px 11px;transition:.13s;white-space:nowrap}
  .copy:hover{border-color:var(--brand);background:var(--brand);color:#fff}
  .copy.ok{border-color:#0E7C66;color:#0E7C66;background:none}
  .none{text-align:center;color:var(--mut);padding:50px 0}
  .folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:12px;margin:0 0 26px}
  .folder{display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    text-decoration:none;color:inherit;font-weight:700;font-size:1.05rem;transition:.13s}
  .folder:hover{border-color:var(--brand);transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,125,168,.10)}
  .folder .ic{flex:0 0 auto;font-size:1.5rem;line-height:1}
  .folder .cnt{margin-inline-start:auto;font-size:.82rem;font-weight:600;color:var(--mut)}
  .back{display:inline-block;margin:0 0 16px;font-size:.9rem;font-weight:600;
    color:var(--brand);text-decoration:none}
  .back:hover{text-decoration:underline}
  /* מצב הצגה מול לקוח: רק שם הפריט. בלי מטא-דאטה פנימי, בלי נתיבים,
     בלי תווית אזור — כלום שמרמז על מה שיש מעבר לסט. */
  body.present .searchbox,body.present .count,body.present .folders,
  body.present footer,body.present .meta,body.present .pathrow,
  body.present .z{display:none}
  body.present .sub{margin-top:2px}
  body.present .card{min-height:96px;justify-content:center}
  body.present .nm{font-size:1.12rem}
  body.present .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  footer{margin-top:38px;color:var(--mut);font-size:.8rem;border-top:1px solid var(--line);padding-top:16px}
  @media(max-width:560px){.wrap{padding:26px 16px 60px}h1{font-size:1.45rem}}
</style>

<!-- זיהוי בעל האתר — חייב לרוץ לפני GA4 -->
<script>
(function(){
  window.__pensyaOwner = false;
  try{

<!-- שלט טיוטא — מקור האמת הוא גיליון Google דרך Apps Script.
     מוצג רק לבעל האתר (?draft=1), ורק אם הדף אינו מסומן כמוגה בגיליון. -->
<script>
(function(){
  try{ if(localStorage.getItem('pensyaDraftMode')!=='1') return; }catch(e){ return; }

  var API = 'https://script.google.com/macros/s/AKfycbyDN7sz74mDKmnvcL9dWH5NK2tpTH-99iwjlX8xt_18I9ME70xL9D2yIDpuayP3VS8/exec';
  var TOKEN = 'pensya-proof-df67a53f804b7528';

  function pathKey(){
    var p = location.pathname.replace(/index\.html$/,'');
    if(p.charAt(p.length-1) !== '/') p += '/';
    return p;
  }

  function post(url, done){
    // text/plain במכוון — מונע preflight של CORS, ש-Apps Script אינו מטפל בו
    return fetch(API, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({token:TOKEN, url:url, done:done})
    });
  }

  function render(){
    var h = document.querySelector('header.header'); if(!h) return;
    var key = pathKey();
    var d = document.createElement('div');
    d.id = 'pensya-draft-sign';
    d.setAttribute('data-nosnippet','');
    d.style.cssText = 'text-align:center;padding:12px 16px;background:#FFF8E6;border-bottom:2px solid #E8B450';
    d.innerHTML =
      '<img src="/design-assets/draft-sign.png" alt="" width="360" height="240"'+
      ' style="max-width:min(360px,70vw);height:auto;display:block;margin:0 auto">'+
      '<button type="button" id="pensya-mark-done" style="margin-top:10px;font:600 15px Heebo,sans-serif;'+
      'background:#5C8D5A;color:#fff;border:0;border-radius:8px;padding:9px 20px;cursor:pointer">'+
      '✓ סמן כמוגה</button>'+
      '<div style="font:600 13px/1.5 Heebo,sans-serif;color:#7A5B00;margin-top:8px">'+
      'סימון פנימי — לא גלוי לגולשים · הביקור הזה לא נספר ב-Analytics<br>'+
      'כיבוי בכל הדפים: <code>?draft=0</code> · '+
      '<a href="/proof/" style="color:#7A5B00">מעקב הגהה</a></div>';
    h.insertAdjacentElement('afterend', d);

    d.querySelector('#pensya-mark-done').addEventListener('click', function(){
      var b = this;
      b.disabled = true; b.textContent = 'שומר בגיליון…'; b.style.background = '#999';
      function fail(msg){
        b.disabled = false; b.style.background = '#C53030';
        b.textContent = '✗ ' + msg;
      }
      post(key, true)
        .then(function(r){ return r.json(); })
        .then(function(j){
          // חובה לוודא שהשרת אישר — אחרת השלט ייעלם בלי שנשמר כלום
          if(!j || !j.ok){
            fail((j && /not found/.test(j.error||'')) ? 'הדף לא נמצא בגיליון — הרץ sync()' : 'השמירה נכשלה');
            return;
          }
          d.style.transition = 'opacity .25s'; d.style.opacity = '0';
          setTimeout(function(){ d.remove(); }, 250);
        })
        .catch(function(){ fail('השמירה נכשלה — נסה שוב'); });
    });
  }

  fetch(API + '?token=' + encodeURIComponent(TOKEN), {redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) return;
      var e = j.pages[pathKey()];
      if(e && e.done) return;                  // כבר מוגה — אין שלט
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', render);
      } else { render(); }
    })
    .catch(function(){ /* אין רשת / ה-API נפל — לא מציגים שלט */ });
})();
</script>

<body>
<div class="wrap">
  <header>
    <h1 id="title">הפורטל האישי</h1>

  <footer>13 פריטים · עודכן 25.08.2026 15:03 · נבנה אוטומטית על ידי <code>private-sync.py</code></footer>
</div>

<script>
const DATA = [{"i": "pension-flow", "fo": "שיחת ייעוץ", "n": "תרשים זרימת הכספים בפנסיה + איזונים אקטואריים", "t": "רכיב", "z": "private", "u": "/private/pension-flow.html", "f": "איזונים אקטואריים.xlsx", "o": "גרסה מקוצצת במצגת ההייטק (בלי מנורה משלימה)", "k": "זרימה כספים פנסיה איזון אקטוארי תרשים מנורה משלימה", "s": "זרימת הכספים בפנסיה + איזונים.html"}, {"i": "menora-index-tracks", "fo": "שיחת ייעוץ", "n": "מנורה — מסלול מחקה מדדי מניות", "t": "רכיב", "z": "private", "u": "/private/menora-index-tracks.html", "f": "indx.co.il (סקיל menora-dashboard-refresh)", "o": "", "k": "מנורה מדדי מניות מחקה מכפיל רווח טופ 20 פילוח מדינות דשבורד", "s": "מנורה מדדי מניות.html"}, {"i": "past-returns", "fo": "שיחת ייעוץ", "n": "תשואות עבר — בדיקה אמפירית", "t": "רכיב", "z": "private", "u": "/private/past-returns.html", "f": "פנסיה נט / גמל נט", "o": "", "k": "תשואות עבר אמפירי היסטוריה השוואה מסלולים", "s": "תשואות עבר - בדיקה אמפירית.html"}, {"i": "managers-to-pension", "fo": "כלים", "n": "האם לנייד ממנהלים לפנסיה", "t": "כלי", "z": "private", "u": "/private/managers-to-pension.html", "f": "", "o": "", "k": "ניוד ביטוח מנהלים פנסיה מקדם המרה החלטה", "s": "האם לנייד ממנהלים לפנסיה - כלי עזר להחלטה.html"}, {"i": "ltc-benefit", "fo": "כלים", "n": "חישוב קצבה סיעודית", "t": "כלי", "z": "private", "u": "/private/ltc-benefit.html", "f": "", "o": "", "k": "סיעוד סיעודית קצבה ביטוח", "s": "חישוב קצבה סיעודית.html"}, {"i": "golden-age", "fo": "כלים", "n": "כספי גיל הזהב", "t": "כלי", "z": "private", "u": "/private/golden-age.html", "f": "", "o": "", "k": "גיל הזהב פרישה קצבה זקנה", "s": "כספי-גיל-הזהב.html"}, {"i": "fixed-fee", "fo": "כלים", "n": "מחשבון עמלה קבועה", "t": "כלי", "z": "private", "u": "/private/fixed-fee.html", "f": "", "o": "", "k": "עמלה קבועה דמי ניהול מחשבון עלות", "s": "מחשבון-עמלה-קבועה.html"}, {"i": "x92fae1", "fo": "מצגת ההייטק", "n": "אתר הרצאת ההייטק — חמש המצגות", "t": "מצגות", "z": "lecture", "u": "https://lecture.pensya.info", "p": "", "f": "", "o": "נבנה מהמקור ב-build-lecture.py", "k": "הרצאה הייטק מצגת יועץ פנסיוני השיא תשואות חוסכים בביטוחים להזיז את המחט", "st": []}, {"i": "xc91213", "fo": "לקוחות", "n": "אזור הלקוחות", "t": "אזור", "z": "clients", "u": "https://pensya.info/clients/", "p": "", "f": "", "o": "", "k": "לקוחות פורטל תגיות CRM מחשבון יעדי חיסכון", "st": []}, {"i": "xe549a8", "fo": "לקוחות", "n": "פילוח יתרות קרנות פנסיה מקיפות", "t": "רכיב", "z": "clients", "u": "https://pensya.info/clients/tools/pension-breakdown/", "p": "", "f": "פנסיה נט (משימה כל 6 שעות)", "o": "", "k": "פילוח קרנות פנסיה קטגוריות מסלולים יתרות מגמה", "st": []}, {"i": "xf2afb8", "fo": "חומרי גלם", "n": "איזונים אקטואריים.xlsx", "t": "חומר גלם", "z": "computer", "u": "", "p": "C:\\Users\\ahituv\\Documents\\אחיטוב תכנון פיננסי\\שיחת ייעוץ\\איזונים אקטואריים.xlsx", "f": "", "o": "מזין את תרשים זרימת הכספים", "k": "איזון אקטוארי אקסל נתונים מקור", "st": []}, {"i": "x61999c", "fo": "חומרי גלם", "n": "מכפיל רווח TA-125.xlsx", "t": "חומר גלם", "z": "computer", "u": "", "p": "C:\\Users\\ahituv\\Documents\\אחיטוב תכנון פיננסי\\כלי עזר\\מכפיל רווח TA-125.xlsx", "f": "", "o": "", "k": "מכפיל רווח תא 125 מדד בורסה", "st": []}, {"i": "x7686ad", "fo": "חומרי גלם", "n": "פנסיה_עדכני.xlsx · קרנות_פנסיה_מסלולים.xlsx", "t": "חומר גלם", "z": "computer", "u": "", "p": "C:\\Users\\ahituv\\אתר\\חומר רקע", "f": "", "o": "נבנה אוטומטית מ-history.csv", "k": "פנסיה עדכני מסלולים קטגוריות אקסל חומר רקע", "st": []}];
const FOLDERS = ["שיחת ייעוץ", "כלים", "מצגת ההייטק", "לקוחות", "חומרי גלם"];
const ICONS = {"שיחת ייעוץ":"🗣️","כלים":"🧰","מצגת ההייטק":"📊","לקוחות":"👥","חומרי גלם":"📁"};
const ZONES = {private:["שלך בלבד","#0E7C66"],lecture:["הרצאה","#9A6B12"],
               clients:["לקוחות","#2E5E8E"],computer:["במחשב","#6B7280"]};
const grid=document.getElementById('grid'), none=document.getElementById('none'),
      cnt=document.getElementById('count'), q=document.getElementById('q');

function card(it){
  const z=ZONES[it.z]||["","#666"];
  const inner=`<div class="top"><span class="z" style="background:${z[1]}">${z[0]}</span>
      <span class="ty">${it.t}</span></div>
    <div class="nm">${it.n}</div>`
    + (it.f?`<div class="meta"><b>מוזן מ:</b> ${it.f}</div>`:``)
    + (it.o?`<div class="meta">${it.o}</div>`:``)
    + (it.s?`<div class="meta"><b>מקור במחשב:</b> ${it.s}</div>`:``)
    + (it.p?`<div class="meta" style="font-size:.78rem">להעתקה ואז Win+R להדבקה ופתיחה</div>`:``)
    + (it.p?`<div class="pathrow"><span class="path" dir="ltr">${it.p}</span>`
           +`<button class="copy" type="button" data-p="${it.p.replace(/"/g,'&quot;')}">העתק נתיב</button></div>`:``);
  if(it.u){const a=document.createElement('a');a.className='card';a.href=it.u;
           if(it.u.startsWith('http'))a.target='_blank';a.innerHTML=inner;return a;}
  const d=document.createElement('div');d.className='card';d.innerHTML=inner;return d;
}
grid.addEventListener('click', async e => {
  if (document.body.classList.contains('picking')) return;
  const b = e.target.closest('.copy');
  if (!b) return;
  const done = () => { const t=b.textContent; b.textContent='הועתק ✓'; b.classList.add('ok');
                       setTimeout(()=>{b.textContent=t;b.classList.remove('ok');},2000); };
  try { await navigator.clipboard.writeText(b.dataset.p); done(); }
  catch(err){
    const ta=document.createElement('textarea'); ta.value=b.dataset.p;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(_){ b.textContent='ההעתקה נכשלה'; }
    document.body.removeChild(ta);
  }
});

function render(list){
  grid.innerHTML=''; list.forEach(it=>grid.appendChild(card(it)));
  none.style.display=list.length?'none':'block';
  cnt.textContent=list.length===DATA.length?`${DATA.length} פריטים`:`${list.length} מתוך ${DATA.length}`;
}
q.addEventListener('input',()=>{
  const t=q.value.trim();
  if(!t)return render(DATA);
  const w=t.split(/\s+/);
  render(DATA.filter(it=>{
    const hay=[it.n,it.t,it.k,it.f||'',it.o||'',it.s||'',it.p||''].join(' ');
    return w.every(x=>hay.includes(x));
  }));
});
// ── תיקיות ────────────────────────────────────────────────────────────────
// /private/?f=<שם התיקייה>  → מציג רק את מה שבתוכה, נקי להצגה מול לקוח.
const folder = new URLSearchParams(location.search).get('f');

if (folder && FOLDERS.includes(folder)) {
  document.body.classList.add('present');
  document.getElementById('title').textContent = folder;
  document.getElementById('sub').textContent = '';
  render(DATA.filter(it => it.fo === folder));
} else {
  const nav = document.getElementById('folders');
  FOLDERS.forEach(name => {
    const n = DATA.filter(it => it.fo === name).length;
    if (!n) return;
    const a = document.createElement('a');
    a.className = 'folder';
    a.href = '?f=' + encodeURIComponent(name);
    a.innerHTML = `<span class="ic">${ICONS[name]||'📁'}</span><span>${name}</span>`
                + `<span class="cnt">${n}</span>`;
    nav.appendChild(a);
  });
  render(DATA);
  q.focus();
}
</script>
