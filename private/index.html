    border:1.5px solid var(--line);background:#fff;color:#A8452F;cursor:pointer;font-size:.9rem;

  body.editing .fsel,body.editing .del{pointer-events:auto}

    padding:18px 20px;margin:0 0 18px;display:none;flex-direction:column;gap:10px}

    border:1.5px solid var(--line);border-radius:8px}
  .addbox input:focus{outline:none;border-color:var(--brand)}
  .addbox .row{display:flex;gap:10px;flex-wrap:wrap}

  .back{display:inline-block;margin:0 0 16px;font-size:.9rem;font-weight:600;
    color:var(--brand);text-decoration:none}

  /* מצב הצגה מול לקוח: רק שם הפריט. בלי מטא-דאטה פנימי, בלי נתיבים,

  body.present footer,body.present .meta,body.present .pathrow,

  footer{margin-top:38px;color:var(--mut);font-size:.8rem;border-top:1px solid var(--line);padding-top:16px}
  @media(max-width:560px){.wrap{padding:26px 16px 60px}h1{font-size:1.45rem}}

<script>
(function(){
  try{ if(localStorage.getItem('pensyaDraftMode')!=='1') return; }catch(e){ return; }

  var API = 'https://script.google.com/macros/s/AKfycbyDN7sz74mDKmnvcL9dWH5NK2tpTH-99iwjlX8xt_18I9ME70xL9D2yIDpuayP3VS8/exec';
  var TOKEN = 'pensya-proof-df67a53f804b7528';

  function pathKey(){
    var p = location.pathname.replace(/index\.html$/,'');
    if(p.charAt(p.length-1) !== '/') p += '/';
    return p;
  }

  function post(url, done){
    // text/plain במכוון — מונע preflight של CORS, ש-Apps Script אינו מטפל בו
    return fetch(API, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({token:TOKEN, url:url, done:done})
    });
  }

  function render(){
    var h = document.querySelector('header.header'); if(!h) return;
    var key = pathKey();
    var d = document.createElement('div');
    d.id = 'pensya-draft-sign';
    d.setAttribute('data-nosnippet','');
    d.style.cssText = 'text-align:center;padding:12px 16px;background:#FFF8E6;border-bottom:2px solid #E8B450';
    d.innerHTML =
      '<img src="/design-assets/draft-sign.png" alt="" width="360" height="240"'+
      ' style="max-width:min(360px,70vw);height:auto;display:block;margin:0 auto">'+
      '<button type="button" id="pensya-mark-done" style="margin-top:10px;font:600 15px Heebo,sans-serif;'+
      'background:#5C8D5A;color:#fff;border:0;border-radius:8px;padding:9px 20px;cursor:pointer">'+
      '✓ סמן כמוגה</button>'+
      '<div style="font:600 13px/1.5 Heebo,sans-serif;color:#7A5B00;margin-top:8px">'+
      'סימון פנימי — לא גלוי לגולשים · הביקור הזה לא נספר ב-Analytics<br>'+
      'כיבוי בכל הדפים: <code>?draft=0</code> · '+
      '<a href="/proof/" style="color:#7A5B00">מעקב הגהה</a></div>';
    h.insertAdjacentElement('afterend', d);

    d.querySelector('#pensya-mark-done').addEventListener('click', function(){
      var b = this;
      b.disabled = true; b.textContent = 'שומר בגיליון…'; b.style.background = '#999';
      function fail(msg){
        b.disabled = false; b.style.background = '#C53030';
        b.textContent = '✗ ' + msg;
      }
      post(key, true)
        .then(function(r){ return r.json(); })
        .then(function(j){
          // חובה לוודא שהשרת אישר — אחרת השלט ייעלם בלי שנשמר כלום
          if(!j || !j.ok){
            fail((j && /not found/.test(j.error||'')) ? 'הדף לא נמצא בגיליון — הרץ sync()' : 'השמירה נכשלה');
            return;
          }
          d.style.transition = 'opacity .25s'; d.style.opacity = '0';
          setTimeout(function(){ d.remove(); }, 250);
        })
        .catch(function(){ fail('השמירה נכשלה — נסה שוב'); });
    });
  }

  fetch(API + '?token=' + encodeURIComponent(TOKEN), {redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) return;
      var e = j.pages[pathKey()];
      if(e && e.done) return;                  // כבר מוגה — אין שלט
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', render);
      } else { render(); }
    })
    .catch(function(){ /* אין רשת / ה-API נפל — לא מציגים שלט */ });
})();
</script>

  const b = e.target.closest('.copy');
  if (!b) return;
  const done = () => { const t=b.textContent; b.textContent='הועתק ✓'; b.classList.add('ok');
                       setTimeout(()=>{b.textContent=t;b.classList.remove('ok');},2000); };
  try { await navigator.clipboard.writeText(b.dataset.p); done(); }
  catch(err){
    const ta=document.createElement('textarea'); ta.value=b.dataset.p;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(_){ b.textContent='ההעתקה נכשלה'; }
    document.body.removeChild(ta);
  }
});

function render(list){
  grid.innerHTML=''; list.forEach(it=>grid.appendChild(card(it)));
  none.style.display=list.length?'none':'block';
  cnt.textContent=list.length===ITEMS.length?`${ITEMS.length} פריטים`:`${list.length} מתוך ${ITEMS.length}`;
}
q.addEventListener('input',()=>{
  const t=q.value.trim();
  if(!t)return render(ITEMS);
  const w=t.split(/\s+/);
  render(ITEMS.filter(it=>{
    const hay=[it.n,it.t,it.k,it.f||'',it.o||'',it.s||'',it.p||''].join(' ');
    return w.every(x=>hay.includes(x));
  }));
});
// ── תיקיות ────────────────────────────────────────────────────────────────
// /private/?f=<שם התיקייה>  → מציג רק את מה שבתוכה, נקי להצגה מול לקוח.
//
// השיוך לתיקיות נשמר בשרת (Cloudflare KV) ונערך מתוך הדף — ראה "סדר תיקיות".
// DATA הוא ברירת המחדל; מה שנשמר בשרת גובר עליו.

let STORE = { assign: {}, extra: [], order: [] };
let ITEMS = [];

function merge(){
  ITEMS = DATA.map(it => {
    const o = Object.assign({}, it);
    if (Object.prototype.hasOwnProperty.call(STORE.assign, it.i))
      o.fo = STORE.assign[it.i] ? [STORE.assign[it.i]] : [];
    return o;
  }).concat((STORE.extra||[]).map(e => ({
    i:e.i, n:e.n, u:e.u, t:"דף באתר", z:"public", fo:e.fo?[e.fo]:[], k:e.n, x:1
  })));
}

function folderList(){
  const seen = [];
  ITEMS.forEach(it => (it.fo||[]).forEach(n => { if(n && !seen.includes(n)) seen.push(n); }));
  const ord = (STORE.order && STORE.order.length) ? STORE.order : FOLDERS;
  return ord.filter(n => seen.includes(n)).concat(seen.filter(n => !ord.includes(n)));
}

const NEWF = "__new__";
function fillSelect(sel, cur){
  const list = folderList();
  sel.innerHTML = `<option value="">— ללא תיקייה —</option>`
    + list.map(n => `<option value="${n}"${n===cur?' selected':''}>${n}</option>`).join('')
    + `<option value="${NEWF}">＋ תיקייה חדשה…</option>`;
}

const folder = new URLSearchParams(location.search).get('f');
const state = document.getElementById('state');

async function load(){
  try {
    const r = await fetch('/private/api', {cache:'no-store'});
    if (r.ok) STORE = Object.assign({assign:{},extra:[],order:[]}, await r.json());
  } catch(e){ /* אין חיבור — נציג את ברירת המחדל */ }
  merge();
  draw();
}

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  state.textContent='שומר…'; state.classList.remove('ok');
  saveTimer = setTimeout(async ()=>{
    try{
      const r = await fetch('/private/api', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({assign:STORE.assign, extra:STORE.extra, order:folderList()})});
      if(!r.ok) throw 0;
      state.textContent='נשמר ✓'; state.classList.add('ok');
      setTimeout(()=>{ state.textContent=''; state.classList.remove('ok'); }, 2500);
    }catch(e){ state.textContent='השמירה נכשלה — נסה שוב'; state.classList.remove('ok'); }
  }, 400);
}

function draw(){
  if (folder) {
    document.body.classList.add('present');
    document.getElementById('title').textContent = folder;
    document.getElementById('sub').textContent = '';
    render(ITEMS.filter(it => (it.fo||[]).includes(folder)));
    return;
  }
  const nav = document.getElementById('folders');
  nav.innerHTML = '';
  folderList().forEach(name => {
    const n = ITEMS.filter(it => (it.fo||[]).includes(name)).length;
    const a = document.createElement('a');
    a.className='folder'; a.href='?f='+encodeURIComponent(name);
    a.innerHTML = `<span class="ic">${ICONS[name]||'📁'}</span><span>${name}</span>`
                + `<span class="cnt">${n}</span>`;
    nav.appendChild(a);
  });
  render(ITEMS);
  document.querySelectorAll('.fsel[data-set]').forEach(sel=>{
    const it = ITEMS.find(x=>x.i===sel.dataset.set);
    fillSelect(sel, (it && it.fo && it.fo[0]) || '');
  });
}

if (folder) { load(); }
else {
  const bEdit=document.getElementById('btnEdit'), bAdd=document.getElementById('btnAdd'),
        bDone=document.getElementById('btnDone'), box=document.getElementById('addbox');

  function mode(on){
    document.body.classList.toggle('editing', on);
    bEdit.style.display = on?'none':'';
    bAdd.style.display  = on?'':'none';
    bDone.style.display = on?'':'none';
    if(!on) box.classList.remove('on');
  }
  bEdit.addEventListener('click', ()=>mode(true));
  bDone.addEventListener('click', ()=>{ mode(false); draw(); });

  // שינוי תיקייה של פריט
  document.addEventListener('change', e=>{
    const sel = e.target.closest('.fsel[data-set]'); if(!sel) return;
    let val = sel.value;
    if (val === NEWF){
      val = (prompt('שם התיקייה החדשה:')||'').trim();
      if(!val){ draw(); return; }
    }
    const id = sel.dataset.set;
    const ex = (STORE.extra||[]).find(x=>x.i===id);
    if (ex) ex.fo = val; else STORE.assign[id] = val;
    merge(); save(); draw(); mode(true);
  });

  // הסרת דף שנוסף ידנית
  document.addEventListener('click', e=>{
    const b = e.target.closest('.del'); if(!b) return;
    STORE.extra = (STORE.extra||[]).filter(x=>x.i!==b.dataset.del);
    merge(); save(); draw(); mode(true);
  });

  // הוספת דף מהאתר
  bAdd.addEventListener('click', ()=>{
    box.classList.add('on');
    fillSelect(document.getElementById('aFolder'), '');
    document.getElementById('aName').focus();
  });
  document.getElementById('aCancel').addEventListener('click', ()=>box.classList.remove('on'));
  document.getElementById('aFolder').addEventListener('change', e=>{
    if(e.target.value===NEWF){
      const v=(prompt('שם התיקייה החדשה:')||'').trim();
      if(v){ const o=document.createElement('option'); o.value=v; o.textContent=v;
             e.target.insertBefore(o, e.target.lastElementChild); e.target.value=v; }
      else e.target.value='';
    }
  });
  document.getElementById('aSave').addEventListener('click', ()=>{
    const n=document.getElementById('aName').value.trim();
    const u=document.getElementById('aUrl').value.trim();
    const fo=document.getElementById('aFolder').value;
    if(!n||!/^https?:\/\//i.test(u)){ alert('צריך שם וגם כתובת שמתחילה ב-http'); return; }
    STORE.extra = STORE.extra||[];
    STORE.extra.push({i:'u'+Date.now().toString(36), n, u, fo: fo===NEWF?'':fo});
    document.getElementById('aName').value=''; document.getElementById('aUrl').value='';
    box.classList.remove('on');
    merge(); save(); draw(); mode(true);
  });

  load().then(()=>q.focus());
}
</script>
</body>
</html>
