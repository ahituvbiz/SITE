<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כלי ניתוח ביטוח מנהלים | אחיטוב תכנון פיננסי</title>
  <style>
    :root {
      --green: #16a34a;
      --green-light: #dcfce7;
      --green-border: #86efac;
      --yellow: #b45309;
      --yellow-light: #fef9c3;
      --yellow-border: #fde047;
      --red: #dc2626;
      --red-light: #fee2e2;
      --red-border: #fca5a5;
      --blue: #1e40af;
      --blue-light: #dbeafe;
      --gray: #374151;
      --gray-light: #f9fafb;
      --gray-border: #e5e7eb;
      --font: 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: #f1f5f9;
      color: var(--gray);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      color: white;
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.85;
    }

    /* Progress bar */
    .progress-wrap {
      background: white;
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 8px;
      background: var(--gray-border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* Question card */
    .question-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .q-number {
      font-size: 0.8rem;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .q-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .q-subtitle {
      font-size: 0.88rem;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 18px;
      border: 2px solid var(--gray-border);
      border-radius: 10px;
      background: var(--gray-light);
      cursor: pointer;
      text-align: right;
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--gray);
      transition: all 0.18s ease;
      width: 100%;
    }

    .option-btn:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .option-btn.selected {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1e3a5f;
      font-weight: 600;
    }

    .option-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .option-text { flex: 1; }
    .option-text strong { display: block; }
    .option-text small { color: #6b7280; font-size: 0.82rem; }

    .option-btn.selected .option-text small { color: #3b82f6; }

    /* Nav buttons */
    .nav-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-start;
      margin-top: 24px;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 10px;
      border: none;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--gray-border);
      color: var(--gray);
    }

    .btn-secondary:hover { background: #d1d5db; }

    .btn-reset {
      background: #fee2e2;
      color: #dc2626;
    }

    .btn-reset:hover { background: #fecaca; }

    /* Answers summary sidebar */
    .answers-summary {
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .answers-summary h3 {
      font-size: 0.9rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--gray-border);
    }

    .answer-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 6px 0;
      font-size: 0.85rem;
      border-bottom: 1px dotted #f3f4f6;
    }

    .answer-item:last-child { border-bottom: none; }
    .answer-label { color: #6b7280; flex-shrink: 0; max-width: 50%; }
    .answer-value { font-weight: 600; color: #111827; text-align: left; }

    /* Result card */
    .result-card {
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 20px;
      animation: fadeIn 0.4s ease;
    }

    .result-card.keep {
      background: var(--green-light);
      border: 2px solid var(--green-border);
    }

    .result-card.transfer {
      background: var(--red-light);
      border: 2px solid var(--red-border);
    }

    .result-card.check {
      background: var(--yellow-light);
      border: 2px solid var(--yellow-border);
    }

    .result-verdict {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .result-card.keep .result-verdict { color: var(--green); }
    .result-card.transfer .result-verdict { color: var(--red); }
    .result-card.check .result-verdict { color: var(--yellow); }

    .result-subtitle {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .result-card.keep .result-subtitle { color: #15803d; }
    .result-card.transfer .result-subtitle { color: #b91c1c; }
    .result-card.check .result-subtitle { color: #92400e; }

    .result-section {
      margin-top: 20px;
    }

    .result-section h4 {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #374151;
      margin-bottom: 10px;
    }

    .factor-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .factor-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .factor-list li::before {
      content: attr(data-icon);
      flex-shrink: 0;
    }

    .flags-box {
      background: #fff7ed;
      border: 1.5px solid #fdba74;
      border-radius: 10px;
      padding: 14px 18px;
      margin-top: 14px;
    }

    .flags-box h4 {
      color: #c2410c;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .flags-box ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .flags-box li {
      font-size: 0.88rem;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .check-box {
      background: var(--blue-light);
      border: 1.5px solid #93c5fd;
      border-radius: 10px;
      padding: 14px 18px;
      margin-top: 14px;
    }

    .check-box h4 {
      color: var(--blue);
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .check-box ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .check-box li {
      font-size: 0.88rem;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    /* Hidden */
    .hidden { display: none !important; }

    /* Responsive */
    @media (max-width: 500px) {
      .question-card { padding: 24px 20px; }
      header { padding: 22px 20px; }
      header h1 { font-size: 1.3rem; }
    }
  </style>

<!-- שלט טיוטא — מקור האמת הוא גיליון Google דרך Apps Script.
     מוצג רק לבעל האתר (?draft=1), ורק אם הדף אינו מסומן כמוגה בגיליון. -->
<script>
(function(){
  try{ if(localStorage.getItem('pensyaDraftMode')!=='1') return; }catch(e){ return; }

  var API = 'https://script.google.com/macros/s/AKfycbyDN7sz74mDKmnvcL9dWH5NK2tpTH-99iwjlX8xt_18I9ME70xL9D2yIDpuayP3VS8/exec';
  var TOKEN = 'pensya-proof-df67a53f804b7528';

  function pathKey(){
    var p = location.pathname.replace(/index\.html$/,'');
    if(p.charAt(p.length-1) !== '/') p += '/';
    return p;
  }

  function post(url, done){
    // text/plain במכוון — מונע preflight של CORS, ש-Apps Script אינו מטפל בו
    return fetch(API, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({token:TOKEN, url:url, done:done})
    });
  }

  function render(){
    var h = document.querySelector('header.header'); if(!h) return;
    var key = pathKey();
    var d = document.createElement('div');
    d.id = 'pensya-draft-sign';
    d.setAttribute('data-nosnippet','');
    d.style.cssText = 'text-align:center;padding:12px 16px;background:#FFF8E6;border-bottom:2px solid #E8B450';
    d.innerHTML =
      '<img src="/design-assets/draft-sign.png" alt="" width="360" height="240"'+
      ' style="max-width:min(360px,70vw);height:auto;display:block;margin:0 auto">'+
      '<button type="button" id="pensya-mark-done" style="margin-top:10px;font:600 15px Heebo,sans-serif;'+
      'background:#5C8D5A;color:#fff;border:0;border-radius:8px;padding:9px 20px;cursor:pointer">'+
      '✓ סמן כמוגה</button>'+
      '<div style="font:600 13px/1.5 Heebo,sans-serif;color:#7A5B00;margin-top:8px">'+
      'סימון פנימי — לא גלוי לגולשים · הביקור הזה לא נספר ב-Analytics<br>'+
      'כיבוי בכל הדפים: <code>?draft=0</code> · '+
      '<a href="/proof/" style="color:#7A5B00">מעקב הגהה</a></div>';
    h.insertAdjacentElement('afterend', d);

    d.querySelector('#pensya-mark-done').addEventListener('click', function(){
      var b = this;
      b.disabled = true; b.textContent = 'שומר בגיליון…'; b.style.background = '#999';
      function fail(msg){
        b.disabled = false; b.style.background = '#C53030';
        b.textContent = '✗ ' + msg;
      }
      post(key, true)
        .then(function(r){ return r.json(); })
        .then(function(j){
          // חובה לוודא שהשרת אישר — אחרת השלט ייעלם בלי שנשמר כלום
          if(!j || !j.ok){
            fail((j && /not found/.test(j.error||'')) ? 'הדף לא נמצא בגיליון — הרץ sync()' : 'השמירה נכשלה');
            return;
          }
          d.style.transition = 'opacity .25s'; d.style.opacity = '0';
          setTimeout(function(){ d.remove(); }, 250);
        })
        .catch(function(){ fail('השמירה נכשלה — נסה שוב'); });
    });
  }

  fetch(API + '?token=' + encodeURIComponent(TOKEN), {redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) return;
      var e = j.pages[pathKey()];
      if(e && e.done) return;                  // כבר מוגה — אין שלט
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', render);
      } else { render(); }
    })
    .catch(function(){ /* אין רשת / ה-API נפל — לא מציגים שלט */ });
})();
</script>

  <header>

  <!-- Progress -->

  <!-- Result area -->
  <div id="resultArea" class="hidden"></div>

</div>

// ============================================================
// FLOW LOGIC
// ============================================================
function getNextQuestion(currentId, answers) {
  switch(currentId) {
    case 'year':
      // After 2013 — skip conversion factor (no guaranteed factor exists)
      if (answers.year === 'after2013') return 'health';
      return 'conversion_factor';

    case 'conversion_factor':
      return 'health';

    case 'health':
      // Section 14 relevant for pre-2004 policies or any policy
      return 'section14';

    case 'section14':
      return 'capital_funds';

    case 'capital_funds':
      // Severance continuity only relevant if there ARE capital funds
      if (answers.capital_funds === 'yes' || answers.capital_funds === 'unknown')
        return 'severance_continuity';
      return 'retirement_track';

    case 'severance_continuity':
      return 'retirement_track';

    case 'retirement_track':
      return 'disability';

    case 'disability':
      return 'pension_quota';

    case 'pension_quota':
      return 'management_fees';

    case 'management_fees':
      return 'result';

    default:
      return 'result';
  }
}

// Ordered flow for progress tracking
const QUESTION_ORDER = [
  'year', 'conversion_factor', 'health', 'section14',
  'capital_funds', 'severance_continuity', 'retirement_track',
  'disability', 'pension_quota', 'management_fees'
];

// ============================================================
// RECOMMENDATION ENGINE
// ============================================================
function computeRecommendation(answers) {
  const a = answers;
  const factors_keep = [];
  const factors_transfer = [];
  const red_flags = [];
  const to_check = [];

  // ── 1. Policy Year (core signal) ──────────────────────────
  let baseVerdict = 'check'; // default

  if (a.year === 'before1990') {
    // Guaranteed real return 3%-4.25% = extremely strong reason to keep
    factors_keep.push('הפוליסה עם הבטחת תשואה ריאלית (3%–4.25%) — נדיר ויקר לשחזר');
    baseVerdict = 'keep';
  } else if (a.year === 'after2013') {
    // Almost always transfer
    factors_transfer.push('פוליסה ללא הבטחת מקדם (2013 ואילך) — קרן פנסיה עדיפה כמעט תמיד');
    baseVerdict = 'transfer';
  } else if (a.year === '2001_2003' || a.year === '2004_2012') {
    factors_transfer.push('פוליסות 2001–2012 בד"כ נחותות מקרן פנסיה מקיפה עדכנית');
    baseVerdict = 'transfer';
  }
  // 1991–2001: neutral start — depends on conversion factor & other params

  // ── 2. Conversion Factor ──────────────────────────────────
  if (a.conversion_factor === 'below175') {
    factors_keep.push('מקדם המרה נמוך מ-175 — יתרון ברור לפוליסה על קרן פנסיה');
    if (baseVerdict === 'transfer') baseVerdict = 'check';
    if (a.year === '1991_2001') baseVerdict = 'keep';
  } else if (a.conversion_factor === '175_210') {
    to_check.push('מקדם המרה 175–210 — דומה לקרן פנסיה, יש לחשב מדויק לפי גיל הלקוח');
    if (a.year === '1991_2001') baseVerdict = 'check';
  } else if (a.conversion_factor === 'above210') {
    factors_transfer.push('מקדם המרה מעל 210 — נחות מקרן פנסיה מקיפה');
  } else if (a.conversion_factor === 'no_factor') {
    factors_transfer.push('אין מקדם המרה מובטח — יתרון מרכזי של קרן פנסיה');
  } else if (a.conversion_factor === 'unknown') {
    to_check.push('מקדם ההמרה אינו ידוע — חובה לאתר בתנאי הפוליסה לפני כל החלטה');
    if (baseVerdict !== 'keep') baseVerdict = 'check';
  }

  // ── 3. Health ──────────────────────────────────────────────
  if (a.health === 'issues') {
    red_flags.push('⚠️ בעיות בריאותיות — בקרן פנסיה תקופת אכשרה 5 שנים לנכות ממחלה קודמת. מעבר עלול לאבד כיסוי קיים!');
    if (baseVerdict === 'transfer') baseVerdict = 'check';
  }

  // ── 4. Section 14 ─────────────────────────────────────────
  if (a.section14 === 'no') {
    red_flags.push('🚨 אין הסכם סעיף 14 — מעבר עלול לחייב את המעביד בהשלמת פיצויים גבוהה. יש לבדוק עם עורך דין לפני שינוי!');
    if (baseVerdict === 'transfer') baseVerdict = 'check';
  } else if (a.section14 === 'unknown') {
    to_check.push('יש לברר קיום סעיף 14 עם המעביד — קריטי לפני שינוי!');
    if (baseVerdict === 'transfer') baseVerdict = 'check';
  }

  // ── 5. Capital Funds ──────────────────────────────────────
  if (a.capital_funds === 'yes') {
    factors_keep.push('כספים הוניים (פיצויים לפני 2008) — זכאים למשיכה פטורה ממס בגיל פרישה; העברה עלולה לאבד הטבה זו');
    if (baseVerdict === 'transfer') baseVerdict = 'check';
  } else if (a.capital_funds === 'unknown') {
    to_check.push('יש לבדוק אם קיימים כספים הוניים — אם כן, משפיע על ההחלטה');
  }

  // ── 6. Severance Continuity ───────────────────────────────
  if (a.severance_continuity === 'yes') {
    red_flags.push('🚨 רצף פיצויים הוגש — העברת כספי הפיצויים מורכבת מאוד ועלולה לגרום לאובדן זכויות מס!');
    if (baseVerdict === 'transfer') baseVerdict = 'check';
  } else if (a.severance_continuity === 'unknown') {
    to_check.push('יש לבדוק אם הוגשה הצהרת רצף פיצויים — אצל חברת הביטוח');
  }

  // ── 7. Retirement Track ───────────────────────────────────
  if (a.year === '1991_2001' && a.conversion_factor === 'below175') {
    if (a.retirement_track === 'with_spouse') {
      to_check.push('פרישה עם קצבת שאירים מגדילה את המקדם בפוליסה — יש לחשב השוואה מול קרן פנסיה עם שאירים');
    } else if (a.retirement_track === 'solo_no_spouse') {
      factors_keep.push('פרישה לרווק + מקדם נמוך — היתרון של הפוליסה חזק במיוחד');
    }
  }
  if (a.retirement_track === 'with_spouse' && a.year !== 'before1990' && a.year !== '1991_2001') {
    factors_transfer.push('קרן פנסיה מקיפה כוללת שאירים אוטומטית — יתרון לקרן');
  }

  // ── 8. Disability ─────────────────────────────────────────
  if (a.disability === 'important') {
    to_check.push('כיסוי עיסוקי חשוב — יש לבדוק אפשרות "מטריה ביטוחית" לקרן פנסיה ולוודא שמכסה מספיק, אחרת לשקול לשמור כיסוי');
    if (baseVerdict === 'transfer') baseVerdict = 'check';
  }

  // ── 9. Pension Quota ──────────────────────────────────────
  if (a.pension_quota === 'above_ceiling') {
    to_check.push('שכר מעל תקרת קרן מקיפה — חלק יופקד בקרן משלימה (פחות מוגנת, דמי ניהול גבוהים יותר)');
  }

  // ── 10. Management Fees ───────────────────────────────────
  if (a.management_fees === 'with15') {
    red_flags.push('⚠️ דמי ניהול 15% מהרווח הריאלי — עלות גבוהה מאוד שמוחקת חלק גדול מהתשואה');
    factors_transfer.push('דמי ניהול 15% מרווח — נטל כבד; קרן פנסיה עדיפה בד"כ');
    if (baseVerdict === 'keep') baseVerdict = 'check';
  } else if (a.management_fees === 'high') {
    factors_transfer.push('דמי ניהול גבוהים מעל 1% — נקודה לטובת מעבר לקרן פנסיה');
  } else if (a.management_fees === 'mid') {
    to_check.push('דמי ניהול בינוניים — כדאי לנסות לשפר לפני החלטה');
  } else if (a.management_fees === 'unknown') {
    to_check.push('יש לברר דמי ניהול מדויקים — כולל בדיקת תנאי 15% מרווח');
  }

  // ── Special: before1990 with no guaranteed return (edge case) ──
  if (a.year === 'before1990') {
    to_check.push('יש לוודא שמדובר בפוליסה עם הבטחת תשואה ריאלית (לא כל פוליסה לפני 1990 כוללת זאת)');
  }

  // ── Final verdict ─────────────────────────────────────────
  // If multiple strong red flags → always check at minimum
  if (red_flags.length >= 2 && baseVerdict === 'transfer') {
    baseVerdict = 'check';
  }

  return { verdict: baseVerdict, factors_keep, factors_transfer, red_flags, to_check };
}

// ============================================================
// UI STATE
// ============================================================
let answers = {};
let history = []; // stack of question IDs for Back button
let currentId = 'year';

// ============================================================
// RENDER
// ============================================================
function getStepNumber() {
  // Count steps from history + current
  return history.length + 1;
}

function getTotalEstimated() {
  // rough estimate
  if (!answers.year) return 10;
  if (answers.year === 'after2013') return 9;
  if (!answers.capital_funds || answers.capital_funds === 'no') return 9;
  return 10;
}

function renderProgress() {
  const step = getStepNumber();
  const total = getTotalEstimated();
  const pct = Math.min(Math.round(((step - 1) / total) * 100), 95);
  document.getElementById('progressText').textContent = `שאלה ${step}`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(qId) {
  const q = QUESTIONS[qId];
  const area = document.getElementById('questionArea');
  const selected = answers[qId] || null;

  const optionsHTML = q.options.map(opt => `
    <button class="option-btn ${selected === opt.value ? 'selected' : ''}"
            onclick="selectOption('${qId}', '${opt.value}', this)"
            data-value="${opt.value}">
      <span class="option-icon">${opt.icon}</span>
      <span class="option-text">
        <strong>${opt.label}</strong>
        <small>${opt.desc}</small>
      </span>
    </button>
  `).join('');

  area.innerHTML = `
    <div class="question-card">
      <div class="q-number">שאלה ${getStepNumber()}</div>
      <div class="q-title">${q.title}</div>
      ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ''}
      <div class="options" id="options_${qId}">
        ${optionsHTML}
      </div>
      <div class="nav-buttons">
        ${history.length > 0 ? `<button class="btn btn-secondary" onclick="goBack()">← אחורה</button>` : ''}
        <button class="btn btn-primary" id="nextBtn" onclick="goNext()"
          ${selected ? '' : 'disabled'}>
          ${getNextQuestion(qId, {...answers, [qId]: selected}) === 'result' ? '📊 הצג המלצה' : 'הבא ←'}
        </button>
      </div>
    </div>
  `;
}

function selectOption(qId, value, el) {
  answers[qId] = value;
  // Update UI
  document.querySelectorAll(`#options_${qId} .option-btn`).forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.value === value);
  });
  document.getElementById('nextBtn').disabled = false;
  // Update next btn label
  const next = getNextQuestion(qId, answers);
  document.getElementById('nextBtn').textContent = next === 'result' ? '📊 הצג המלצה' : 'הבא ←';

  renderAnswersSummary();
}

function goNext() {
  const q = QUESTIONS[currentId];
  if (!answers[currentId]) return;
  const next = getNextQuestion(currentId, answers);
  history.push(currentId);

  if (next === 'result') {
    showResult();
  } else {
    currentId = next;
    renderProgress();
    renderQuestion(currentId);
    renderAnswersSummary();
  }
}

function goBack() {
  if (history.length === 0) return;
  currentId = history.pop();
  renderProgress();
  renderQuestion(currentId);
  renderAnswersSummary();
}

function renderAnswersSummary() {
  if (Object.keys(answers).length === 0) return;
  const summary = document.getElementById('answersSummary');
  const content = document.getElementById('answersContent');
  summary.classList.remove('hidden');

  const labelMap = {
    year: 'שנת פוליסה',
    conversion_factor: 'מקדם המרה',
    health: 'בריאות',
    section14: 'סעיף 14',
    capital_funds: 'כספים הוניים',
    severance_continuity: 'רצף פיצויים',
    retirement_track: 'מסלול פרישה',
    disability: 'כיסוי עיסוקי',
    pension_quota: 'תקרת קרן',
    management_fees: 'דמי ניהול',
  };

  const rows = Object.entries(answers).map(([key, val]) => {
    const q = QUESTIONS[key];
    const opt = q ? q.options.find(o => o.value === val) : null;
    return `<div class="answer-item">
      <span class="answer-label">${labelMap[key] || key}</span>
      <span class="answer-value">${opt ? opt.label : val}</span>
    </div>`;
  }).join('');

  content.innerHTML = rows;
}

  const labelMap = {
    year: 'שנת פוליסה',
    conversion_factor: 'מקדם המרה',
    health: 'בריאות',
    section14: 'סעיף 14',
    capital_funds: 'כספים הוניים',
    severance_continuity: 'רצף פיצויים',
    retirement_track: 'מסלול פרישה',
    disability: 'כיסוי עיסוקי',
    pension_quota: 'תקרת קרן',
    management_fees: 'דמי ניהול',
  };

  const summaryRows = Object.entries(answers).map(([key, val]) => {
    const q = QUESTIONS[key];
    const opt = q ? q.options.find(o => o.value === val) : null;
    return `<div class="answer-item">
      <span class="answer-label">${labelMap[key] || key}</span>
      <span class="answer-value">${opt ? opt.label : val}</span>
    </div>`;
  }).join('');

  const resultArea = document.getElementById('resultArea');
  resultArea.classList.remove('hidden');
  resultArea.innerHTML = `
    <div class="result-card ${vd.cssClass}">
      <div class="result-verdict">${vd.emoji} ${vd.title}</div>
      <div class="result-subtitle">${vd.subtitle}</div>

      ${factorsHTML}
      ${redFlagsHTML}
      ${toCheckHTML}

      <div class="result-section">
        <h4>📋 סיכום תשובות</h4>
        <div style="border-radius:10px;background:rgba(255,255,255,0.6);padding:12px 16px;">
          ${summaryRows}
        </div>
      </div>

      <div class="result-actions">
        <button class="btn btn-reset" onclick="resetTool()">🔄 לקוח חדש — אפס הכל</button>
        <button class="btn btn-secondary" onclick="goBackToQuestions()">← ערוך תשובות</button>
      </div>
    </div>
  `;

  // Hide progress & summary sidebar
  document.getElementById('answersSummary').classList.add('hidden');

  // Scroll to result
  resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function goBackToQuestions() {
  // Go back to last question
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('progressWrap').classList.remove('hidden');

  currentId = history[history.length - 1] || 'year';
  renderProgress();
  renderQuestion(currentId);
  renderAnswersSummary();
  document.getElementById('answersSummary').classList.remove('hidden');
}

function resetTool() {
  answers = {};
  history = [];
  currentId = 'year';

  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('progressWrap').classList.remove('hidden');
  document.getElementById('answersSummary').classList.add('hidden');
  document.getElementById('answersContent').innerHTML = '';

  renderProgress();
  renderQuestion(currentId);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// INIT
// ============================================================
renderProgress();
renderQuestion(currentId);
</script>
</body>
</html>
