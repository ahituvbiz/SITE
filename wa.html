<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>פותח וואטסאפ…</title>
<style>
  html,body{height:100%;margin:0}
  body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:#f6f7f9;color:#111;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .card{max-width:420px;width:100%}
  .dot{font-size:44px;margin-bottom:8px}
  h1{font-size:20px;margin:0 0 6px}
  p{font-size:15px;color:#555;margin:0 0 20px}
  a.btn{display:inline-block;background:#25D366;color:#fff;text-decoration:none;
        font-size:17px;font-weight:600;padding:13px 26px;border-radius:10px}
  a.small{display:block;margin-top:16px;color:#888;font-size:13px}
</style>
<!--@CHROME:HEAD@-->
<!-- זיהוי בעל האתר — חייב לרוץ לפני GA4 -->
<script>
(function(){
  window.__pensyaOwner = false;
  try{
    var p = new URLSearchParams(location.search);
    var d = p.get('draft'), n = p.get('notrack');
    if(d==='1') localStorage.setItem('pensyaDraftMode','1');
    if(d==='0') localStorage.removeItem('pensyaDraftMode');
    if(n==='1') localStorage.setItem('pensyaNoTrack','1');
    if(n==='0') localStorage.removeItem('pensyaNoTrack');
    window.__pensyaOwner = localStorage.getItem('pensyaDraftMode')==='1'
                        || localStorage.getItem('pensyaNoTrack')==='1';
  }catch(e){}
})();
</script>
<!-- Google Analytics 4 — לא נטען כלל עבור בעל האתר -->
<script>
(function(){
  if(window.__pensyaOwner) return;
  var s=document.createElement('script');
  s.async=true; s.src='https://www.googletagmanager.com/gtag/js?id=G-E3PV7TKMLP';
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){dataLayer.push(arguments);};
  gtag('js', new Date());
  gtag('config', 'G-E3PV7TKMLP');
})();
</script>
<!-- שלט טיוטא — מקור האמת הוא גיליון Google דרך Apps Script.
     מוצג רק לבעל האתר (?draft=1), ורק אם הדף אינו מסומן כמוגה בגיליון. -->
<script>
(function(){
  try{ if(localStorage.getItem('pensyaDraftMode')!=='1') return; }catch(e){ return; }

  var API = 'https://script.google.com/macros/s/AKfycbyDN7sz74mDKmnvcL9dWH5NK2tpTH-99iwjlX8xt_18I9ME70xL9D2yIDpuayP3VS8/exec';
  var TOKEN = 'pensya-proof-df67a53f804b7528';

  function pathKey(){
    var p = location.pathname.replace(/index\.html$/,'');
    if(p.charAt(p.length-1) !== '/') p += '/';
    return p;
  }

  function post(url, done){
    // text/plain במכוון — מונע preflight של CORS, ש-Apps Script אינו מטפל בו
    return fetch(API, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({token:TOKEN, url:url, done:done})
    });
  }

  function render(){
    var h = document.querySelector('header.header'); if(!h) return;
    var key = pathKey();
    var d = document.createElement('div');
    d.id = 'pensya-draft-sign';
    d.setAttribute('data-nosnippet','');
    d.style.cssText = 'text-align:center;padding:12px 16px;background:#FFF8E6;border-bottom:2px solid #E8B450';
    d.innerHTML =
      '<img src="/design-assets/draft-sign.png" alt="" width="360" height="240"'+
      ' style="max-width:min(360px,70vw);height:auto;display:block;margin:0 auto">'+
      '<button type="button" id="pensya-mark-done" style="margin-top:10px;font:600 15px Heebo,sans-serif;'+
      'background:#5C8D5A;color:#fff;border:0;border-radius:8px;padding:9px 20px;cursor:pointer">'+
      '✓ סמן כמוגה</button>'+
      '<div style="font:600 13px/1.5 Heebo,sans-serif;color:#7A5B00;margin-top:8px">'+
      'סימון פנימי — לא גלוי לגולשים · הביקור הזה לא נספר ב-Analytics<br>'+
      'כיבוי בכל הדפים: <code>?draft=0</code> · '+
      '<a href="/proof/" style="color:#7A5B00">מעקב הגהה</a></div>';
    h.insertAdjacentElement('afterend', d);

    d.querySelector('#pensya-mark-done').addEventListener('click', function(){
      var b = this;
      b.disabled = true; b.textContent = 'שומר בגיליון…'; b.style.background = '#999';
      function fail(msg){
        b.disabled = false; b.style.background = '#C53030';
        b.textContent = '✗ ' + msg;
      }
      post(key, true)
        .then(function(r){ return r.json(); })
        .then(function(j){
          // חובה לוודא שהשרת אישר — אחרת השלט ייעלם בלי שנשמר כלום
          if(!j || !j.ok){
            fail((j && /not found/.test(j.error||'')) ? 'הדף לא נמצא בגיליון — הרץ sync()' : 'השמירה נכשלה');
            return;
          }
          d.style.transition = 'opacity .25s'; d.style.opacity = '0';
          setTimeout(function(){ d.remove(); }, 250);
        })
        .catch(function(){ fail('השמירה נכשלה — נסה שוב'); });
    });
  }

  fetch(API + '?token=' + encodeURIComponent(TOKEN), {redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) return;
      var e = j.pages[pathKey()];
      if(e && e.done) return;                  // כבר מוגה — אין שלט
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', render);
      } else { render(); }
    })
    .catch(function(){ /* אין רשת / ה-API נפל — לא מציגים שלט */ });
})();
</script>
<!--@/CHROME:HEAD@-->
</head>
<body>
  <div class="card">
    <div class="dot">💬</div>
    <h1>פותח וואטסאפ…</h1>
    <p>אם השיחה לא נפתחה תוך שנייה, לחץ על הכפתור.</p>
    <a id="go" class="btn" href="#">פתח את השיחה</a>
    <a id="web" class="small" href="#">לא עבד? נסה דרך הדפדפן</a>
  </div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var phone = (q.get('phone') || '').replace(/[^0-9]/g, '');
  var text  = q.get('text') || '';
  var enc   = text ? '&text=' + encodeURIComponent(text) : '';
  var appUrl = 'whatsapp://send?phone=' + phone + enc;
  var webUrl = 'https://wa.me/' + phone + (text ? '?text=' + encodeURIComponent(text) : '');
  var go  = document.getElementById('go');
  var web = document.getElementById('web');
  go.href  = appUrl;
  web.href = webUrl;
  if (!phone) { go.textContent = 'חסר מספר טלפון'; return; }
  try { window.location.href = appUrl; } catch (e) {}
})();
</script>
</body>
</html>
