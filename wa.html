<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>פותח וואטסאפ…</title>
<style>
  html,body{height:100%;margin:0}
  body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:#f6f7f9;color:#111;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .card{max-width:420px;width:100%}
  .dot{font-size:44px;margin-bottom:8px}
  h1{font-size:20px;margin:0 0 6px}
  p{font-size:15px;color:#555;margin:0 0 20px}
  a.btn{display:inline-block;background:#25D366;color:#fff;text-decoration:none;
        font-size:17px;font-weight:600;padding:13px 26px;border-radius:10px}
  a.small{display:block;margin-top:16px;color:#888;font-size:13px}
</style>
<!--@CHROME:HEAD@-->
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E3PV7TKMLP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-E3PV7TKMLP');
</script>
<!-- שלט טיוטא — מוצג רק לבעל האתר. הפעלה: ?draft=1 | כיבוי: ?draft=0 -->
<script>
(function(){
  try{
    var K='pensyaDraftMode', p=new URLSearchParams(location.search), q=p.get('draft');
    if(q==='1'){localStorage.setItem(K,'1');}
    if(q==='0'){localStorage.removeItem(K);}
    if(localStorage.getItem(K)!=='1') return;
    document.addEventListener('DOMContentLoaded',function(){
      var h=document.querySelector('header.header'); if(!h) return;
      var d=document.createElement('div');
      d.id='pensya-draft-sign';
      d.setAttribute('data-nosnippet','');
      d.style.cssText='text-align:center;padding:12px 16px;background:#FFF8E6;border-bottom:2px solid #E8B450';
      d.innerHTML='<img src="/design-assets/draft-sign.png" alt="" width="360" height="240"'+
        ' style="max-width:min(360px,70vw);height:auto;display:inline-block">'+
        '<div style="font:600 13px/1.5 Heebo,sans-serif;color:#7A5B00;margin-top:6px">'+
        'סימון פנימי — לא גלוי לגולשים. כיבוי: הוסף <code>?draft=0</code> לכתובת · '+
        '<a href="/proof/" style="color:#7A5B00">מעקב הגהה</a></div>';
      h.insertAdjacentElement('afterend', d);
    });
  }catch(e){}
})();
</script>
<!--@/CHROME:HEAD@-->
</head>
<body>
  <div class="card">
    <div class="dot">💬</div>
    <h1>פותח וואטסאפ…</h1>
    <p>אם השיחה לא נפתחה תוך שנייה, לחץ על הכפתור.</p>
    <a id="go" class="btn" href="#">פתח את השיחה</a>
    <a id="web" class="small" href="#">לא עבד? נסה דרך הדפדפן</a>
  </div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var phone = (q.get('phone') || '').replace(/[^0-9]/g, '');
  var text  = q.get('text') || '';
  var enc   = text ? '&text=' + encodeURIComponent(text) : '';
  var appUrl = 'whatsapp://send?phone=' + phone + enc;
  var webUrl = 'https://wa.me/' + phone + (text ? '?text=' + encodeURIComponent(text) : '');
  var go  = document.getElementById('go');
  var web = document.getElementById('web');
  go.href  = appUrl;
  web.href = webUrl;
  if (!phone) { go.textContent = 'חסר מספר טלפון'; return; }
  try { window.location.href = appUrl; } catch (e) {}
})();
</script>
</body>
</html>
