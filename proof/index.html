<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>מעקב הגהה — פנימי</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:400 16px/1.6 Heebo,system-ui,sans-serif;background:#F8F6F2;color:#1A1A1A}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:#555;font-size:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:20px;margin-bottom:20px}
.big{font-size:40px;font-weight:700;color:#007DA8;line-height:1}
.bar{height:12px;background:#E5E7EB;border-radius:99px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#007DA8,#5C8D5A);width:0;transition:width .4s}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools button{font:inherit;font-size:14px;padding:7px 12px;border:1px solid #E5E7EB;background:#fff;border-radius:8px;cursor:pointer}
.tools button:hover{background:#F1F5F9}
input[type=search]{flex:1;min-width:180px;padding:8px 12px;border:1px solid #E5E7EB;border-radius:8px;font:inherit}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #F1F1F1}
li.done{opacity:.45}
li.done .ttl{text-decoration:line-through}
li.saving{opacity:.5}
input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:3px;cursor:pointer;accent-color:#5C8D5A}
.meta{flex:1;min-width:0}
.ttl{font-weight:600;font-size:15px;display:block;margin-bottom:2px}
.u{font-size:12px;color:#999;word-break:break-all}
.go{font-size:13px;color:#007DA8;text-decoration:none;flex:none;padding-top:3px}
#gate{max-width:340px;margin:15vh auto;text-align:center}
#gate input{width:100%;padding:10px;border:1px solid #E5E7EB;border-radius:8px;font:inherit;text-align:center}
#app{display:none}
#status{font-size:13px;color:#777;min-height:20px}
.err{color:#C53030;font-weight:600}
a.sheet{font-size:13px;color:#007DA8}
</style>
</head>
<body>
<div id="gate" class="card">
  <h1>מעקב הגהה</h1>
  <p class="sub">אזור פנימי</p>
  <input type="password" id="pw" placeholder="סיסמה" autocomplete="off">
</div>

<div class="wrap" id="app">
  <h1>מעקב הגהה — pensya.info</h1>
  <p class="sub">מקור האמת הוא <a class="sheet" id="sheetlink" href="#" target="_blank">גיליון Google</a>. כל סימון נשמר שם מיד.</p>

  <div class="card">
    <div><span class="big" id="cnt">0</span> <span style="color:#555">מתוך <b id="tot">0</b> דפים הוגהו · <b id="pct">0%</b></span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="sub" style="margin:12px 0 0" id="left"></div>
  </div>

  <div class="card">
    <div class="tools">
      <input type="search" id="q" placeholder="סינון לפי שם או כתובת...">
      <button id="hide">הסתר שהוגהו</button>
      <button id="reload">רענן מהגיליון</button>
      <span id="status"></span>
    </div>
    <ul id="list"></ul>
  </div>
</div>

<script>
var API   = 'https://script.google.com/macros/s/AKfycbyDN7sz74mDKmnvcL9dWH5NK2tpTH-99iwjlX8xt_18I9ME70xL9D2yIDpuayP3VS8/exec';
var TOKEN = 'pensya-proof-df67a53f804b7528';
var DATA  = {};
var hideDone = false;

function status(msg, isErr){
  var s=document.getElementById('status');
  s.textContent = msg || '';
  s.className = isErr ? 'err' : '';
}

function load(){
  status('טוען מהגיליון…');
  return fetch(API + '?token=' + encodeURIComponent(TOKEN), {redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) throw new Error(j && j.error || 'שגיאה');
      DATA = j.pages; status(''); render();
    })
    .catch(function(e){ status('טעינה נכשלה: ' + e.message, true); });
}

function save(url, done, li){
  li.classList.add('saving');
  return fetch(API, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({token:TOKEN, url:url, done:done})
  }).then(function(){
    DATA[url].done = done; li.classList.remove('saving'); render();
  }).catch(function(){
    li.classList.remove('saving');
    status('השמירה נכשלה — הסימון לא נשמר בגיליון', true);
    render();
  });
}

function render(){
  var q = (document.getElementById('q').value||'').trim();
  var ul = document.getElementById('list'); ul.innerHTML='';
  var keys = Object.keys(DATA).sort();
  var done = 0;
  keys.forEach(function(u){
    var e = DATA[u];
    if(e.done) done++;
    if(q && e.title.indexOf(q) < 0 && u.indexOf(q) < 0) return;
    if(hideDone && e.done) return;
    var li = document.createElement('li');
    li.className = e.done ? 'done' : '';
    li.innerHTML = '<input type="checkbox"'+(e.done?' checked':'')+'>'+
      '<div class="meta"><span class="ttl"></span><span class="u"></span></div>'+
      '<a class="go" target="_blank">פתח ↗</a>';
    li.querySelector('.ttl').textContent = e.title || u;
    li.querySelector('.u').textContent = u + (e.date ? ' · סומן ' + String(e.date).slice(0,24) : '');
    li.querySelector('.go').href = u + '?draft=1';
    li.querySelector('input').onchange = function(){ save(u, this.checked, li); };
    ul.appendChild(li);
  });
  var tot = keys.length, pct = tot ? Math.round(done/tot*100) : 0;
  document.getElementById('cnt').textContent = done;
  document.getElementById('tot').textContent = tot;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('left').textContent = (tot && done===tot) ? 'הכול הוגה. סיימת.' : ('נותרו ' + (tot-done) + ' דפים.');
}

document.getElementById('pw').addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(this.value === 'hagaha'){
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    load();
  } else { this.value=''; this.placeholder='סיסמה שגויה'; }
});
document.getElementById('q').oninput = render;
document.getElementById('hide').onclick = function(){
  hideDone = !hideDone; this.textContent = hideDone ? 'הצג הכול' : 'הסתר שהוגהו'; render();
};
document.getElementById('reload').onclick = load;
</script>
</body>
</html>
