<style>

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  .maplink{display:inline-block; margin-top:8px; font-size:.85em; color:#7a6a52;}
  .mapbox{margin-top:12px; background:#f3f0e6; border:1px solid #e0d5bd; border-radius:12px; padding:6px;}
  .mapbox svg{display:block; width:100%; height:auto;}
  .maplegend{font-size:.75em; color:#7a6a52; text-align:center; margin-top:2px;}
  @keyframes pulse{0%{r:9}50%{r:13}100%{r:9}}
  .curstop{animation:pulse 1.2s infinite;}
  .hidden{display:none;}
  .cert{text-align:center; border:6px double var(--gold); border-radius:14px; padding:22px 14px; background:#fffdf2;}

function syncUrl(){ return SYNC_URL || localStorage.getItem('montesyncurl') || ''; }
let lastPush=0;
function pushSync(){
  const u=syncUrl(); if(!u || !S.room) return;

 {min:0,   name:"חוקר מתחיל 🧭"},
 {min:110, name:"בלש שטח 🔍"},
 {min:190, name:"מגלה ארצות 🗺️"},
 {min:260, name:"יורש מונטיפיורי 👑"}
];
const PARENT_CODE="1885"; // שנת פטירתו של מונטיפיורי

/* ---------- מצב ---------- */
let S = JSON.parse(localStorage.getItem('montegame')||'null') || {
  screen:'intro', st:0, phase:'riddle', score:0, names:'',
  tries:{}, bonus:{}, done:false, room:''
};
function save(){ localStorage.setItem('montegame', JSON.stringify(S)); pushSync(); }

/* ---------- עזר ---------- */
const app=document.getElementById('app');
function el(h){const d=document.createElement('div');d.innerHTML=h;return d;}
function renderHeader(){
  const p=document.getElementById('progress'); p.innerHTML='';
  STATIONS.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='dot';
    if(i<S.st||S.done) d.classList.add('done');
    else if(i===S.st&&S.screen==='game') d.classList.add('cur');
    d.textContent=i+1; p.appendChild(d);
  });
  document.getElementById('scorebar').textContent='⭐ '+S.score+' נקודות';
  document.getElementById('roomfoot').innerHTML = S.room ? 'קוד קבוצה: <b>'+S.room+'</b> · ' : '';
}
function norm(t){return (t||'').trim().replace(/["'\s]+/g,'');}
function confetti(){
  for(let i=0;i<40;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.textContent=['🎉','⭐','🎊','🏅'][i%4];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(2+Math.random()*2)+'s';
    c.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),5000);
  }
}

/* מפה סכמטית של המתחם */
const MAPPOS=[[100,68],[128,150],[152,163],[172,182],[162,202],[205,192],[222,215],[232,240],[88,322],[190,325]];
function miniMap(cur){

    dots+=`<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="${isCur?'#b5432f':done?'#c9962e':'#bdb299'}" stroke="#fff" stroke-width="2" ${isCur?'class="curstop"':''}/>
           <text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">${i+1}</text>`;
  });
  return `<div class="mapbox"><svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="400" fill="#efe9d8" rx="10"/>
    <path d="M60,0 C55,80 70,200 60,290 C55,340 40,380 30,400" stroke="#cfc6b0" stroke-width="14" fill="none"/>
    <text x="42" y="200" font-size="9" fill="#8f8468" transform="rotate(-84 42,200)">רחוב המלך דוד</text>
    <path d="M75,40 C140,30 180,60 190,110 C200,160 150,200 120,240 C100,270 80,300 70,340 L110,360 C160,330 220,300 230,260 C240,210 230,150 240,90 L200,20 Z" fill="#d5e3c8" opacity=".8"/>
    <text x="120" y="105" font-size="10" fill="#6f8a5e">גן בלומפילד</text>
    <rect x="196" y="185" width="52" height="70" fill="#e8ddc2" stroke="#c9b98f" rx="4"/>
    <text x="222" y="222" font-size="9" fill="#8a7a52" text-anchor="middle">ימין משה</text>
    <ellipse cx="238" cy="322" rx="34" ry="22" fill="#dcd4be" stroke="#c2b795"/>
    <text x="238" y="326" font-size="8" fill="#8a7a52" text-anchor="middle">בריכת הסולטן</text>
    <rect x="252" y="358" width="26" height="16" fill="#e0d5bd" stroke="#c2b795" rx="3"/>
    <text x="265" y="386" font-size="8" fill="#8a7a52" text-anchor="middle">סינמטק</text>
    <rect x="60" y="28" width="34" height="18" fill="#e0d5bd" stroke="#c2b795" rx="3"/>
    <text x="77" y="22" font-size="8" fill="#8a7a52" text-anchor="middle">מלון המלך דוד</text>
    <text x="285" y="14" font-size="12" fill="#8f8468" text-anchor="middle">⬆ צפון</text>
    <polyline points="${pts}" fill="none" stroke="#b5432f" stroke-width="2.5" stroke-dasharray="5,5" opacity=".65"/>
    ${dots}
    <text x="128" y="142" font-size="12" text-anchor="middle">🌬️</text>
  </svg>
  <div class="maplegend">🔴 היעד שלכם עכשיו · 🟡 תחנות שכבשתם · המפה מצוירת בערך — העיניים שלכם מדויקות יותר!</div></div>`;
}

/* ---------- מסכים ---------- */
function render(){
  renderHeader(); app.innerHTML='';
  if(S.screen==='intro') return renderIntro();
  if(S.screen==='parent') return renderParent();
  if(S.done) return renderEnd();
  renderStation();
}

  app.appendChild(el(`

       ❓ לענות על שאלה מתוך הערך<br>

    <div class="card" style="margin:10px 0; background:#f7efdd;">

function startGame(){
  S.names=document.getElementById('names').value||'';
  if(!S.room) S.room=String(Math.floor(1000+Math.random()*9000));
  S.screen='game'; S.st=0; S.phase='riddle'; save(); render();
}

function renderStation(){
  const st=STATIONS[S.st], n=S.st+1;
  const head=`<div class="card"><span class="stationemoji">${st.emoji}</span>
     <span class="tag">תחנה ${n} מתוך ${STATIONS.length}</span>
     <h2>${S.phase==='riddle' ? 'לאן עכשיו?' : st.name}</h2>`;

  if(S.phase==='riddle'){
    app.appendChild(el(head+`
      <div class="riddle">🧭 ${st.riddle}</div>
      ${miniMap(S.st)}
      <button class="btn ghost" onclick="document.getElementById('dirs').style.display='block';this.style.display='none';">🧭 עדיין מתלבטים? הוראות הגעה מדויקות</button>
      <div class="hintbox" id="dirs">🚶 ${st.dirs}</div>
      <a class="maplink" href="${st.map}" target="_blank" rel="noopener">🗺️ גלגל הצלה אחרון: פתיחת מפה אמיתית</a>
      <button class="btn" onclick="S.phase='wiki';save();render();window.scrollTo(0,0);">✅ מצאנו! הגענו לתחנה</button>
    </div>`));
    return;
  }

  if(S.phase==='wiki'){
    const paras = st.wiki.map(p=>`<div class="wpara"><span class="reader r${p.r}">📖 ${READERS[p.r]} מקריא/ה</span><p>${p.t}</p></div>`).join('');
    app.appendChild(el(head+`
      <div class="wikibox">
        <div class="wtag">📖 מיני-ויקיפדיה של המסע</div>
        <h3>${st.wikiTitle}</h3>
        ${paras}
        <div class="funfact">${st.fun}</div>
      </div>
      <p style="font-size:.9em; margin-top:10px;">👆 כל אחד מקריא בקול את הפסקה שלו — השאלות הבאות מסתתרות בתוך הערך ובשטח!</p>
      <button class="btn" onclick="S.phase='q1';save();render();window.scrollTo(0,0);">📚 קראנו הכול! לשאלות</button>
    </div>`));
    return;
  }

  if(S.phase==='q1'||S.phase==='q2'){
    const q = S.phase==='q1' ? st.q1 : st.q2;
    const tag = S.phase==='q1' ? '<span class="tag wiki">❓ שאלה מתוך הערך</span>' : '<span class="tag field">👀 שאלת שטח — תסתכלו טוב!</span>';
    let body=head+tag+`<p style="margin:8px 0 0;"><b>${q.q}</b></p>`;
    if(q.input){
      body+=`<input type="text" id="ans" inputmode="text" placeholder="התשובה שלכם">
             <button class="btn" onclick="checkInput()">בדיקה</button>`;
    } else {
      q.opts.forEach((o,i)=>{ body+=`<button class="opt" id="opt${i}" onclick="checkOpt(${i})">${o}</button>`; });
    }
    body+=`<div class="msg" id="msg"></div>
      <button class="btn ghost" onclick="document.getElementById('hint').style.display='block'">💡 רמז</button>
      <div class="hintbox" id="hint">💡 ${q.hint}</div>
      <button class="btn ghost" onclick="S.phase='wiki';save();render();">📖 חזרה לערך</button>
    </div>`;
    app.appendChild(el(body));
    return;
  }

  if(S.phase==='bonus'){
    const key='b'+S.st;
    app.appendChild(el(head+`
      <div class="msg ok">🎉 כל הכבוד! פתרתם את תחנת ${st.name}!</div>
      <div class="bonus">
        <label><input type="checkbox" id="bchk" ${S.bonus[key]?'checked':''} onchange="toggleBonus('${key}')">
        <span>${st.bonus}<br><small>סמנו ✔ רק אחרי שביצעתם באמת (אמא שופטת ראשית!)</small></span></label>
      </div>
      <button class="btn gold" onclick="nextStation()">${S.st<STATIONS.length-1 ? '🧭 לחידת הדרך הבאה!' : '🏆 לסיום המסע!'}</button>
    </div>`));
    return;
  }
}

function award(base){
  const key=S.phase+'-'+S.st;
  const tries=S.tries[key]||0;
  return Math.max(base-3*tries, 4);
}
function markTry(){ const key=S.phase+'-'+S.st; S.tries[key]=(S.tries[key]||0)+1; }

function checkOpt(i){
  const st=STATIONS[S.st], q=S.phase==='q1'?st.q1:st.q2;
  const msg=document.getElementById('msg');
  if(i===q.right){
    document.getElementById('opt'+i).classList.add('right');
    S.score+=award(10);
    msg.className='msg ok'; msg.textContent='נכון! ⭐';
    setTimeout(()=>{ S.phase = S.phase==='q1' ? 'q2' : 'bonus'; save(); render(); window.scrollTo(0,0); },700);
  } else {
    document.getElementById('opt'+i).classList.add('wrong');
    markTry(); msg.className='msg no'; msg.textContent='לא בדיוק... נסו שוב! (אפשר להציץ שוב בערך)';
  }
  save(); renderHeader();
}
function checkInput(){
  const st=STATIONS[S.st], q=S.phase==='q1'?st.q1:st.q2;
  const v=norm(document.getElementById('ans').value);
  const msg=document.getElementById('msg');
  if(q.answer.some(a=>norm(a)===v)){
    S.score+=award(10);
    msg.className='msg ok'; msg.textContent='נכון! ⭐';
    setTimeout(()=>{ S.phase = S.phase==='q1' ? 'q2' : 'bonus'; save(); render(); window.scrollTo(0,0); },700);
  } else {
    markTry(); msg.className='msg no'; msg.textContent='לא בדיוק... תסתכלו שוב ונסו שנית!';
  }
  save(); renderHeader();
}
function toggleBonus(key){
  const chk=document.getElementById('bchk');
  if(chk.checked && !S.bonus[key]){ S.bonus[key]=true; S.score+=15; }
  else if(!chk.checked && S.bonus[key]){ delete S.bonus[key]; S.score-=15; }
  save(); renderHeader();
}
function nextStation(){
  if(S.st<STATIONS.length-1){ S.st++; S.phase='riddle'; }
  else { S.done=true; }
  save(); render(); window.scrollTo(0,0);
  if(S.done) confetti();
}

function renderEnd(){
  const rank=[...RANKS].reverse().find(r=>S.score>=r.min);
  app.appendChild(el(`
  <div class="card cert">
    <div style="font-size:2.2em;">🏆</div>
    <h2>תעודת סיום המסע</h2>
    <p>מוענקת בזאת ל:</p>
    <div class="names"><b>${S.names||'החוקרים האמיצים'}</b></div>
    <p>על שהשלימו בהצלחה את כל 10 התחנות<br><b>המסע בעקבות מונטיפיורי</b><br>במשכנות שאננים, ימין משה וגן בלומפילד</p>
    <div class="rank">${rank.name}</div>
    <p>⭐ ${S.score} נקודות</p>
    <p style="font-size:.9em;">ירושלים, ${new Date().toLocaleDateString('he-IL')}</p>
  </div>
  <div class="card">
    <h2>🎁 ורגע... המטמון?</h2>
    <p>מונטיפיורי תמיד דאג לתת לאחרים. עכשיו תורכם לקבל: <b>גשו למלווה שלכם ותגידו את המשפט הסודי —</b></p>
    <div class="riddle">"אנחנו יורשי מונטיפיורי, ובאנו לקבל את המטמון!"</div>
    <p style="font-size:.9em;">(למלווה יש הוראות סודיות משלו 😉)</p>
    <button class="btn ghost" onclick="if(confirm('להתחיל משחק חדש? הניקוד יימחק.')){localStorage.removeItem('montegame');location.reload();}">🔄 משחק חדש</button>
  </div>`));
}

/* ---------- אזור מלווה ---------- */
function parentGate(){
  const c=prompt('אזור המלווה 🔑\nהקלידו את הקוד (רמז: השנה שבה נפטר מונטיפיורי בגיל 100... 1785+100):');
  if(c===PARENT_CODE){ S.screen='parent'; render(); window.scrollTo(0,0); }
  else if(c!==null) alert('קוד שגוי');
}
function backFromParent(){ S.screen = S.names||S.st>0 ? 'game' : 'intro'; render(); }
function saveSyncUrl(){
  const v=document.getElementById('syncin').value.trim();
  if(v){ localStorage.setItem('montesyncurl', v); alert('נשמר! הסנכרון פעיל.'); }
  else { localStorage.removeItem('montesyncurl'); alert('הכתובת נמחקה.'); }
  render();
}
function renderParent(){
  let keys='';
  STATIONS.forEach((st,i)=>{
    const a1 = st.q1.input ? st.q1.answer[0] : st.q1.opts[st.q1.right];
    const a2 = st.q2.input ? st.q2.answer[0] : st.q2.opts[st.q2.right];
    keys+=`<p>${st.emoji} <b>תחנה ${i+1} — ${st.name}</b><br>ערך: <b>${a1}</b><br>שטח: <b>${a2}</b></p>`;
  });
  const su=syncUrl();
  app.appendChild(el(`
  <div class="parent">
  <div class="card">
    <h2>🔑 אזור המלווה</h2>
    <h3>לפני היציאה</h3>
    <p>⏱️ משך משוער: 2–2.5 שעות הליכה נינוחה (10 תחנות) · 🥤 מים וכובעים (אין הרבה צל בין התחנות) · 🔋 טלפונים טעונים · 🎁 <b>להחביא/להכין פרס-מטמון</b> — מומלץ גלידה בסינמטק או הפתעה קטנה בתיק. כשהילדים אומרים בסוף את "המשפט הסודי" — מגישים את המטמון.</p>
    <h3>חלוקת קריאה</h3>
    <p>כל ערך מחולק ל-4 פסקאות צבעוניות: רבקה 🔴, טליה 🟣, שמואל 🔵, שניאור 🟢. סדר הפתיחה מתחלף בין התחנות כדי שלכולם יהיה תור להתחיל.</p>
    <h3>המסלול בקצרה</h3>
    <p>מתחילים בגן בלומפילד מאחורי מלון המלך דוד (קבר משפחת הורדוס) → יורדים דרומה לטחנת הרוח → הכרכרה לידה → הבית הארוך של משכנות שאננים → המרכז למוזיקה (באותו מתחם) → תצפית החומות ומגדל דוד מהטיילת → סמטאות ימין משה → בית הכנסת הספרדי הגדול → חוצים את הגן למזרקת האריות (בפינה הדרומית, מול גן הפעמון) → תצפית על בריכת הסולטן → סיום מומלץ: סינמטק (גלידה!). רוצים לקצר? אפשר לדלג על מזרקת האריות ולרדת ישר לבריכת הסולטן — חוסך כ-10 דקות.</p>
    <h3>👀 מעקב מכמה טלפונים</h3>
    <p>קוד הקבוצה של המשחק הזה: <span class="roomcode">${S.room||'ייווצר ביציאה לדרך'}</span></p>
    <p style="font-size:.9em;">טלפון שרוצה לצפות בהתקדמות: פותח את אותה כתובת, לוחץ למטה על "👀 מעקב מרחוק" ומזין את קוד הקבוצה. <b>דרוש שרת סנכרון</b> (Apps Script) — ${su?'✅ מוגדר ופעיל':'⚠️ עדיין לא הוגדר'}.</p>
    <input type="text" id="syncin" placeholder="הדביקו כאן את כתובת ה-Apps Script" value="${localStorage.getItem('montesyncurl')||''}">
    <button class="btn ghost" onclick="saveSyncUrl()">שמירת כתובת סנכרון</button>
    <h3>תשובות (לחירום בלבד 😉)</h3>
    <div class="anskey">${keys}</div>
    <h3>תקלות</h3>
    <p>המשחק נשמר אוטומטית בטלפון — אפשר לסגור ולפתוח את הדפדפן. "איפוס" בתחתית הדף מוחק הכול.</p>
    <button class="btn" onclick="backFromParent()">חזרה למשחק</button>
  </div></div>`));
}

/* ---------- מצב מעקב מרחוק ---------- */
let watchTimer=null;
function renderWatch(){
  document.querySelector('header.game .sub').textContent='מצב מעקב מרחוק 👀';
  app.innerHTML='';
  const su=syncUrl();
  app.appendChild(el(`
  <div class="card">
    <h2>👀 מעקב אחרי הקבוצה</h2>
    ${su?'':'<div class="watchbar">⚠️ לא הוגדרה כתובת סנכרון. הדביקו אותה כאן:<input type="text" id="wsync" placeholder="כתובת ה-Apps Script" value=""><button class="btn ghost" onclick="localStorage.setItem(\'montesyncurl\',document.getElementById(\'wsync\').value.trim());renderWatch();">שמירה</button></div>'}
    <p>הזינו את קוד הקבוצה (מופיע בתחתית המסך בטלפון המשחק):</p>
    <input type="text" id="wroom" inputmode="numeric" placeholder="למשל 4271" value="${localStorage.getItem('montewatchroom')||''}">
    <button class="btn gold" onclick="startWatch()">התחלת מעקב</button>
    <div id="wstatus"></div>
  </div>`));
}
function startWatch(){
  const room=document.getElementById('wroom').value.trim();
  if(!room) return;
  localStorage.setItem('montewatchroom', room);
  if(watchTimer) clearInterval(watchTimer);
  pollWatch(room);
  watchTimer=setInterval(()=>pollWatch(room), 15000);
}
function pollWatch(room){
  const u=syncUrl(); const box=document.getElementById('wstatus');
  if(!u){ box.innerHTML='<div class="watchbar">⚠️ אין כתובת סנכרון.</div>'; return; }
  fetch(u+'?room='+encodeURIComponent(room)+'&nc='+Date.now())
   .then(r=>r.json())
   .then(d=>{
      if(!d||!d.t){ box.innerHTML='<div class="watchbar">עוד אין נתונים לקבוצה '+room+'. ודאו שהמשחק התחיל ושקוד הקבוצה נכון.</div>'; return; }
      const st=Math.min(d.st,STATIONS.length-1);
      const name=d.done?'🏆 סיימו את המסע!':STATIONS[st].name;
      const phases={riddle:'🧭 מנווטים אל התחנה',wiki:'📖 קוראים את הערך',q1:'❓ עונים על שאלת הערך',q2:'👀 עונים על שאלת השטח',bonus:'📸 במשימת הבונוס'};
      const ago=Math.max(0,Math.round((Date.now()-d.t)/60000));
      box.innerHTML=`<div class="watchbar">
        <b>${d.names||'הקבוצה'}</b><br>
        📍 תחנה ${d.done?STATIONS.length:st+1}/${STATIONS.length}: <b>${name}</b><br>
        ${d.done?'':phases[d.phase]||''}<br>
        ⭐ ${d.score} נקודות · עודכן לפני ${ago<1?'פחות מדקה':ago+' דק\''}
      </div>`+miniMap(d.done?STATIONS.length:st);
   })
   .catch(()=>{ box.innerHTML='<div class="watchbar">שגיאת תקשורת — ננסה שוב בעוד רגע.</div>'; });
}

/* ---------- הפעלה ---------- */
if(new URLSearchParams(location.search).has('follow')){ renderWatch(); }
else render();
</script>
