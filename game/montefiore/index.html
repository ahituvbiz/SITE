<style>

<!-- שלט טיוטא — רק לבעל האתר, ורק בדפים שטרם הוגהו.
     הפעלה: ?draft=1 · כיבוי גלובלי: ?draft=0
     מסתתר אוטומטית בדף שסומן כמוגה ב-/proof/ (מפתח localStorage: pensyaProof) -->
<script>
(function(){
  var PROOF_KEY='pensyaProof';
  function pathKey(){
    var p = location.pathname.replace(/index\.html$/,'');
    if(p.charAt(p.length-1)!=='/') p += '/';
    return p;
  }
  function readProof(){
    try{ return JSON.parse(localStorage.getItem(PROOF_KEY)||'{}'); }catch(e){ return {}; }
  }
  function isDone(){
    var st=readProof(), k=pathKey();
    var e = st[k] || st[k.replace(/\/$/,'')];
    return !!(e && e.done);
  }
  function setDone(v){
    var st=readProof(), k=pathKey();
    st[k]=st[k]||{}; st[k].done=v;
    try{ localStorage.setItem(PROOF_KEY, JSON.stringify(st)); }catch(e){}
  }
  try{
    if(localStorage.getItem('pensyaDraftMode')!=='1') return;
    if(isDone()) return;                       // הדף כבר מוגה — אין שלט
    document.addEventListener('DOMContentLoaded',function(){
      var h=document.querySelector('header.header'); if(!h) return;
      var d=document.createElement('div');
      d.id='pensya-draft-sign';
      d.setAttribute('data-nosnippet','');
      d.style.cssText='text-align:center;padding:12px 16px;background:#FFF8E6;border-bottom:2px solid #E8B450';
      d.innerHTML=
        '<img src="/design-assets/draft-sign.png" alt="" width="360" height="240"'+
        ' style="max-width:min(360px,70vw);height:auto;display:block;margin:0 auto">'+
        '<button type="button" id="pensya-mark-done" style="margin-top:10px;font:600 15px Heebo,sans-serif;'+
        'background:#5C8D5A;color:#fff;border:0;border-radius:8px;padding:9px 20px;cursor:pointer">'+
        '✓ סמן כמוגה</button>'+
        '<div style="font:600 13px/1.5 Heebo,sans-serif;color:#7A5B00;margin-top:8px">'+
        'סימון פנימי — לא גלוי לגולשים · הביקור הזה לא נספר ב-Analytics<br>'+
        'כיבוי בכל הדפים: <code>?draft=0</code> · '+
        '<a href="/proof/" style="color:#7A5B00">מעקב הגהה</a></div>';
      h.insertAdjacentElement('afterend', d);
      d.querySelector('#pensya-mark-done').addEventListener('click',function(){
        setDone(true);
        d.style.transition='opacity .25s'; d.style.opacity='0';
        setTimeout(function(){ d.remove(); }, 250);
      });
    });
  }catch(e){}
})();
</script>

 wiki:[
 {t:"לירושלים תמיד הייתה בעיה אחת גדולה: מים. העיר יושבת על הרים, רחוק מנהרות ואגמים, והגשם יורד רק בחורף. איך שורדים כך אלפי שנים? בתחבולות מבריקות: מתחת כמעט לכל בית חצבו בור לאיסוף מי גשמים מהגג, בעמקים בנו בריכות ענק, ומרחוק הובילו מים באמות — תעלות בנויות שבהן המים זורמים לבדם. בירושלים העתיקה, מים היו שווים יותר מזהב."},
 {t:"המפעל המדהים מכולם היה אמת המים התחתונה: תעלה שהובילה מים מבריכות שלמה שליד בית לחם ועד הר הבית — מרחק עצום של עשרות קילומטרים בגלל הפיתולים סביב ההרים. והפלא הגדול: המים זרמו לאורך כל הדרך בכוח הכבידה בלבד, בלי משאבות! הבנאים הקדומים חישבו שיפוע עדין ומדויק להפליא לאורך כל התוואי. והתעלה הזאת עברה ממש כאן — על גשר עתיק שחצה את העמק בדיוק במקום שבו עובר הסכר של הבריכה."},
 {t:"הבריכה עצמה נוצרה בשיטה פשוטה וחכמה: בנו סכר רוחבי בעמק, ומי הגשמים שזרמו במורד נאגרו מאחוריו ויצרו אגם קטן. כאן אגרו מים עוד מימי קדם — חוקרים מצאו בבריכה תעלה חצובה ומטויחת מהתקופה הרומית, ויש המזהים אותה עם \"בריכת הנחשים\" שהזכיר ההיסטוריון יוסף בן מתתיהו. עולי רגל נוצרים קראו לה בימי הביניים \"בריכת בת שבע\", כי האמינו שמכאן צפה דוד המלך בבת שבע."},
 {t:"ומי היה \"הסולטן\" שעל שמו נקראת הבריכה? הפתעה: כנראה שני סולטנים שונים! הראשון היה הסולטן הממלוכי ברקוק, שבשנת 1392 הרחיב את הבריכה לממדי ענק: 167 מטר אורך, 67 מטר רוחב ו-12 מטר עומק — כ-30,000 מטרים מעוקבים של מים, כמו עשר בריכות שחייה אולימפיות! השני היה הסולטן העות'מאני סולימאן המפואר — זה שבנה את החומות — ששיפץ אותה שוב בשנת 1536."},
 {t:"סולימאן הוסיף על הסכר גם סַבִּיל — ברזיית אבן מפוארת שממנה שתו עוברי הדרך הצמאים בחינם, מצווה חשובה באסלאם. הסביל עומד שם עד היום, עם כתובת ההקדשה המקורית של סולימאן — ובזכות הכתובת הזאת אנחנו יודעים בוודאות מי שיפץ את הבריכה ומתי. אבן אחת עם כמה שורות חרוטות, שמספרת סיפור בן 500 שנה."},
 {t:"במאות השנים שאחרי כן המתה סביב הבריכה תנועה בלתי פוסקת: שיירות גמלים וחמורים עצרו להשקות את הבהמות, רועים הביאו עדרים, עולי רגל מילאו כדים. ובמאה ה-19 התקיים כאן שוק בהמות שוקק פעמיים בשבוע — צעקות סוחרים, געיות פרות ונעירות חמורים בדיוק במקום שבו עומדת היום הבמה. ואז הגיעה הטכנולוגיה: צינורות ומשאבות מודרניים החלו להזרים מים לירושלים, והבריכה העתיקה התייבשה והתרוקנה."},
 {t:"במשך שנים ארוכות עמדה הבריכה יבשה ושוממה, ונדמה היה שסיפורה נגמר. ואז מישהו שם לב שהבריכה הריקה היא בעצם... אמפיתיאטרון טבעי מושלם: רצפה שטוחה וענקית, מדרונות סביב לישיבה, אקוסטיקה נהדרת — ומעל הכול, נוף החומות המוארות הכי יפה שיש. הבריכה שהשקתה גמלים הפכה לאחת מבמות ההופעות המפורסמות בישראל, וגדולי הזמרים מהארץ ומהעולם הופיעו בה מול אלפים."},
 {t:"עצמו עיניים ודמיינו את המקום בשלושה זמנים: לפני 2,000 שנה — מים כחולים ואמת מים על הגשר; לפני 150 שנה — שוק בהמות רועש ושיירות גמלים; והיום בערב קיץ — אלפי אנשים, אורות, מוזיקה מתחת לכוכבים. שלושה עולמות שלמים באותו עמק בדיוק. ואם אתם הייתם עולים על הבמה הזאת מול אלפים — איזה שיר הייתם שרים?"}

 wiki:[
 {t:"כדי להבין את בית הכנסת הזה, צריך לחזור יותר מ-500 שנה אחורה, לאחד הרגעים הקשים בהיסטוריה היהודית. בשנת 1492 החליטו מלכי ספרד לגרש את כל יהודי ממלכתם: מאות אלפי אנשים — סוחרים, רופאים, חכמים, ילדים — נאלצו לעזוב בבת אחת את הבתים שבהם חיו משפחותיהם מאות שנים. חלקם נדדו לצפון אפריקה, חלקם לאיטליה והולנד — ורבים הגיעו לאימפריה העות'מאנית, שהסולטן שלה קיבל אותם בזרועות פתוחות ואמר על מלך ספרד: \"הוא רושש את ארצו והעשיר את ארצי\"."},
 {t:"המגורשים הביאו איתם אוצר מיוחד: שפה משלהם — לדינו, תערובת של ספרדית עתיקה ועברית, בדיוק כמו שיידיש היא תערובת של גרמנית ועברית. בלדינו דיברו בבית, שרו שירי ערש, וסיפרו סיפורים. חלק מהמגורשים המשיכו עד ירושלים, ובמשך מאות שנים היו הספרדים הקהילה הגדולה והמובילה בעיר — קהילה של חכמים, סוחרים ובעלי מלאכה, שראשיה נשאו בגאווה את התואר העתיק \"הראשון לציון\"."},
 {t:"כשנבנתה ימין משה, היו בין מייסדיה משפחות ספרדיות ותיקות ומכובדות מירושלים — צאצאי אותם מגורשים. ובשנת 1897 הן חנכו בחגיגה גדולה את בית הכנסת הזה. באותם ימים, בית כנסת שכונתי היה הרבה יותר ממקום תפילה: כאן התפללו בשבתות ובחגים, כאן חגגו בר-מצוות וחתונות, כאן למדו תורה בערבים, כאן התאספו בשעת שמחה ובשעת צרה. זה היה הלב הפועם של השכונה."},
 {t:"אם תציצו פנימה (כשפתוח), תגלו סידור פנימי מיוחד ולא שגרתי: הבימה — הבמה המוגבהת שממנה קוראים בתורה — לא עומדת במרכז מול ארון הקודש כמו ברוב בתי הכנסת, אלא באלכסון! וכיוון התפילה מכוון כך שהמתפללים פונים אל עבר הכותל המערבי והר הבית. ולמה אלכסון? כדי לשלב בין מסורת הבנייה הספרדית לבין הכיוון הקדוש — פתרון יצירתי של הבנאים."},
 {t:"אם בית הכנסת פתוח, ההצצה פנימה שווה הכול: איורים יפהפיים על הקירות, מנורות זכוכית צבעוניות, נברשת גדולה שיורדת מהתקרה, וויטראז'ים צבעוניים בחלונות המקושתים. ויש שם עוד דבר אחד, חשוב במיוחד: על הקיר הצפוני קבוע לוח זיכרון לבחור בשם אברהם מיכאל קירשנבאום, שהציל את השכונה כולה. מי הוא היה? את הסיפור המלא תשמעו ממש בתחנה הבאה — בינתיים רק תזכרו את השם."},
 {t:"חשבו על זה רגע: המתפללים כאן רואים מבעד לחלונות את הר ציון ואת חומות העיר העתיקה. הם לא צריכים לדמיין את המקום שאליו הם מתפללים — הוא ממש מול העיניים שלהם. אין הרבה בתי כנסת בעולם שזוכים לנוף כזה. ובתפילות עצמן שולטים הפיוטים והלחנים הספרדיים העתיקים — מנגינות שחלקן נולדו עוד בספרד, לפני הגירוש, ועברו מאב לבן יותר מ-500 שנה."},
 {t:"ובית הכנסת הזה יודע גם מהי גבורה שקטה: בשנות הגבול המסוכנות (1948–1967), כשצלפים ישבו על החומות ממול וכדורים שרקו מעל הגגות, המשיכו מתפללים עקשנים להגיע לכאן, שבת אחרי שבת, חג אחרי חג. התפילות בבית הכנסת לא פסקו אפילו בתקופות הקשות ביותר — בית תפילה קטן שמסרב להיכנע לצלפים."},
 {t:"והיום, יותר מ-125 שנה אחרי החנוכה החגיגית, בית הכנסת עדיין פעיל — אותן תפילות, אותם לחנים, באותו מקום. תעצרו רגע ותחשבו כמה דברים השתנו סביבו: אימפריות קמו ונפלו, מלחמות עברו, השכונה התרוקנה והתמלאה פעמיים — ובית הכנסת ממשיך. יש בזה משהו מנחם: יש דברים שפשוט נשארים."},
 {t:"עכשיו למשימה: עמדו בשקט ליד הכניסה, מצאו את השלט של בית הכנסת, וחפשו עליו את שנת הייסוד — היא מסתתרת גם בערך שקראתם עכשיו. וזכרו: זהו מקום קדוש ופעיל. מדברים בו בנימוס, לא מרימים קול, ואם יש תפילה — לא מפריעים. גם זו דרך לכבד 500 שנות מסורת."}

 {t:"השכונה נבנתה יפה במיוחד: שורות מסודרות של בתי אבן עם גגות רעפים אדומים, שנראו אז חידוש מרהיב בנוף הירושלמי. התיישבו בה משפחות ותיקות ומכובדות מירושלים — ספרדים ואשכנזים זה לצד זה. המיקום נחשב מצוין: קרוב לעיר העתיקה, מול הנוף הכי יפה בעיר. אף אחד לא יכול היה לנחש שדווקא המיקום המושלם הזה יהפוך יום אחד לקללה של השכונה."},
 {t:"כי בשנת 1948, במלחמת העצמאות, קרה הדבר: קו הגבול בין ישראל לירדן עבר בדיוק כאן, בעמק שלמטה. הלגיון הירדני התבצר על החומות ממול — הרימו מבט אליהן ותראו בעצמכם כמה הן גבוהות ושולטות על השכונה. צלפים ירו לעבר הבתים, התושבים נמלטו, והשכונה ננטשה כמעט כליל. עוד מעט, בתחנה האחרונה של המסע, תקראו על הקרבות האלה עדות מצמררת ממקור ראשון — ממישהו מהמשפחה שלכם."},
 {t:"ועכשיו לסיפור שהבטחנו ליד לוח הזיכרון: ב-10 בפברואר 1948 הסתערו מאות תוקפים על השכונה מכמה כיוונים, עם חומרי נפץ ופחי דלק, במטרה לשרוף אותה. על ההגנה פיקד אברהם מיכאל קירשנבאום — בחור צעיר שגדל בבית הארוך של משכנות שאננים, תלמידו של הרב הצדיק אריה לוין, והיחיד בשכונה שידע להפעיל את המקלע היחיד שהיה בה. מגג בית בפינת הרחובות התקווה והמצודה הוא ירה בלי הפסקה שש שעות, פגע בפחי הדלק של התוקפים והדף גל אחרי גל. באמצע הקרב נפצע בירכו מירי — והמשיך להילחם, עד שאחרון התוקפים נסוג. השכונה ניצלה."},
 {t:"אבל לסיפור סוף עצוב: כשפינו את אברהם הפצוע על אלונקה ליד הכביש הראשי, פגע בו צלף שנית — והפעם אנושות. יומיים אחר כך מת מפצעיו, וירושלים כולה התאבלה על הגיבור בן ה-22. מנחם בגין פרסם עליו כרוז שהשווה אותו לגיבורי תל חי — \"יוסף הגלילי ואברהם הימיני\". משימת שטח מיוחדת: בפינת הרחובות התקווה והמצודה קבוע לוח אבן לזכרו — מצאו אותו וקראו מה כתוב עליו!"},
 {t:"אחרי המלחמה יושבה השכונה מחדש, הפעם על ידי משפחות עולים מטורקיה ומכורדיסטן, שקיבלו את הדירות בשכונת הספר המסוכנת כי לא היה להן במה לבחור. במשך 19 שנה הם חיו על קו הגבול ממש: קירות מגן מול החלונות, ריצה כפופה ברחובות החשופים לצלפים, וילדים שלמדו מגיל אפס איפה מותר ללכת ואיפה אסור. השכונה היפה הפכה למוזנחת ועצובה — טיח מתקלף, עוני, ושקט מתוח באוויר."},
 {t:"ואז, במלחמת ששת הימים ב-1967, העיר התאחדה והגבול נעלם בן לילה. פתאום התברר שימין משה היא אחת השכונות היפות בירושלים: נוף ישר אל החומות, בתי אבן היסטוריים, וסמטאות שקטות. הממשלה החליטה להפוך אותה לשכונת אמנים, אקדמאים וסופרים, והחל שיפוץ גדול."},
 {t:"אבל כאן חשוב לספר גם את הצד הפחות יפה של הסיפור: התוכנית לוותה בפינוי של התושבים הוותיקים — אותן משפחות עולים שהחזיקו את השכונה בשנים הקשות ביותר — ורבים מהם פונו נגד רצונם. הם כעסו, ובצדק: הם סבלו את שנות הצלפים, וכשהשכונה סוף סוף הפכה בטוחה ויקרה — נשלחו למקום אחר. גם זה חלק מההיסטוריה, וכדאי לזכור אותו כשמטיילים בסמטאות היפות."},
 {t:"היום ימין משה היא שכונת אמנים פורחת ואחת השכונות היקרות והמבוקשות בירושלים: ציירים, פסלים וסופרים חיים ויוצרים בה, גלריות פתוחות מציצות מהסמטאות, ובקיץ מתקיימים בה פסטיבלים. ככה זה בירושלים: מקום אחד יכול לספר בתוך מאה שנה ארבעה סיפורים שונים לגמרי — שכונה מפוארת, קו חזית, שכונת עולים, ופנינת אמנות."},
 {t:"עכשיו צאו לסיור חושים בסמטאות! שימו לב: כמעט כל הסמטאות כאן הן בעצם גרמי מדרגות — השכונה בנויה על מדרון תלול, ולכן אין בה כמעט מכוניות, וזו אחת הסיבות לשקט המיוחד שלה. תוך כדי הליכה, שחקו: מי מוצא את הדלת הכי יפה? חצר עם הכי הרבה עציצים? חתול על גדר? שלט של גלריה? ושימו לב לשמות הסמטאות על השלטים: המגדל, המצודה, התקווה, הבריכה — כל שם הוא רמז לנוף שמסביבכם. השכונה כולה היא מוזיאון פתוח, בחינם."}

 {t:"החומות שממול נראות עתיקות כמו העיר עצמה — אבל האמת מפתיעה: הן \"רק\" בנות כ-490 שנה, צעירות יחסית במושגים ירושלמיים. את החומה הראשונה בנו כאן הכנענים לפני יותר מ-4,000 שנה! מאז חרבה העיר ונבנתה שוב ושוב — וכמעט כל כובש חדש בנה חומה חדשה, לא פעם ממש על שרידי הקודמת, שכבה על גבי שכבה. החומה שאתם רואים היא האחרונה בשרשרת הארוכה הזאת."},
 {t:"את החומה הנוכחית בנה בשנים 1535–1541 הסולטן העות'מאני סולימאן המפואר — אחד השליטים החזקים בהיסטוריה, ששלט על אימפריה אדירה שהשתרעה על שלוש יבשות. ירושלים הייתה אז עיר קטנה וחשופה, וסולימאן החליט להקיף אותה בחומה מפוארת שתגן עליה ותפאר את שמו. התוצאה: כ-4 קילומטרים של חומה מאבני ענק, עם 34 מגדלי שמירה ושערים מרשימים."},
 {t:"בחומה שבעה שערים פתוחים — ביניהם שער יפו שמימינכם, שער שכם ושער האריות — ויש גם שער שמיני, חתום: שער הרחמים, שפונה להר הבית ממזרח. השער הזה נאטם לפני מאות שנים, ולפי המסורת היהודית דרכו ייכנס המשיח לירושלים. שערי העיר ננעלו פעם בכל לילה, ומי שאיחר — ישן בחוץ. זכרו את הפרט הזה — הוא יתחבר לסיפור מפחיד באמת בעוד תחנה אחת, במשכנות שאננים."},
 {t:"ועכשיו לאגדה המפורסמת: מספרים שכאשר הושלמה הבנייה, גילה סולימאן דבר שהכעיס אותו מאוד — שני האדריכלים הראשיים השאירו את הר ציון, ובו קבר דוד המלך, מחוץ לחומה! הסולטן זעם כל כך, שציווה להוציא את שניהם להורג. ולפי המסורת, שני הקברים שנמצאים עד היום ממש ליד שער יפו הם קבריהם של האדריכלים המסכנים. האם זה קרה באמת? איש אינו יודע. אבל הר ציון באמת נשאר בחוץ — הביטו ימינה ותראו בעצמכם את הגבעה עם המגדלים, מחוץ לחומה."},
 {t:"עכשיו חפשו משמאל את המצודה הגדולה עם המגדל העגול והגבוה — \"מגדל דוד\", הסמל המפורסם של ירושלים. ועכשיו הפתעה: השם הזה הוא טעות אחת גדולה! למגדל אין שום קשר לדוד המלך. במקום הזה עמדו מבצרים של החשמונאים ושל הורדוס, ואחריהם בנו ושיפצו כאן ממלוכים ועות'מאנים. עוד לפני מאות רבות של שנים טעו עולי רגל וחשבו שכאן עמד ארמונו של דוד — והשם פשוט נדבק ולא הרפה."},
 {t:"והמגדל העגול עצמו, זה שמצטלם בכל תמונה של ירושלים? הוא בכלל צריח תפילה (מינרט) שנבנה לפני כ-400 שנה, בתקופה העות'מאנית. כלומר: הסמל המפורסם ביותר של ירושלים היהודית העתיקה הוא בעצם מגדל תפילה עות'מאני שנקרא בטעות על שם מלך ישראל. היום שוכן במצודה מוזיאון תולדות ירושלים, ובלילות מוקרנים על קירותיה מופעי אור מרהיבים."},
 {t:"והעמק העמוק שמפריד בינינו לבין החומות? זהו גיא בן הינום — ולו הסיפור המצמרר מכולם: בימי קדם עבדו בו עובדי אלילים שהקריבו קורבנות באש, והמקום נחשב כל כך נורא ומקולל, שממנו נולדה המילה \"גיהינום\" — בעברית ובשפות רבות אחרות! היום, למרבה המזל, זה סתם עמק ירוק ויפה עם פסטיבלים והופעות. מגיהינום לגן משחקים — רק בירושלים."},
 {t:"ועוד סוד אחד לסיום: יודעים למה בכלל אפשר היה לצאת מהחומות ולבנות את השכונות שמסביבכם? כי במאה ה-19, עם המצאת התותחים המודרניים, חומות פשוט הפסיקו להגן על ערים — ואיבדו את תפקידן הצבאי. החומה נשארה יפה, אבל כבר לא הייתה חיונית. ועכשיו — משחק תצפית! מצאו: (1) את החומה, (2) את מגדל דוד העגול, (3) את הר ציון שמחוץ לחומה, (4) את שער יפו. מי שמצא את כל הארבעה — צועק \"ירושלים!\""}

 {t:"נסו לדמיין: עד לפני כ-165 שנה, כל תושבי ירושלים — כולם! — גרו בתוך החומות של העיר העתיקה. בשלהי התקופה העות'מאנית הגיעה הצפיפות שם לממדים בלתי נסבלים: יהודים, מוסלמים, נוצרים וארמנים הצטופפו בבתים ישנים ורעועים, הביוב זרם ברחובות, מגפות התפשטו במהירות, ומחירי הדירות הרקיעו. העיר פשוט נחנקה בתוך החומות שלה — אבל אף אחד לא העז לצאת."},
 {t:"למה לא יצאו? כי בחוץ היה מפחיד באמת. מחוץ לחומות השתרעו גבעות ריקות ושוממות, ובלילות שלטו בהן כנופיות שודדים שהפילו אימה על כל הסביבה. שערי העיר ננעלו בכל ערב, ומי שנשאר בחוץ אחרי הנעילה — נשאר לבד בחושך, בלי הגנה. שהייה מחוץ לחומות בלילה נחשבה לסכנת חיים של ממש. וכך, מאות שנים, ירושלים נשארה כלואה בתוך עצמה."},
 {t:"ואז נכנס לסיפור אדם שמעולם לא ראה את ירושלים: יהודה טורא, סוחר יהודי עשיר מהעיר ניו אורלינס שבאמריקה. טורא היה אדם שקט ומופנם, שחי לבדו וצבר הון גדול. כשנפטר בשנת 1854 בלי יורשים, התגלתה בצוואתו הפתעה: 50,000 דולר — סכום עתק באותם ימים — לרווחת עניי ירושלים וארץ ישראל. ידידו הנאמן דאג שהצוואה תקוים, והכסף הופקד בידי האיש המתאים ביותר: משה מונטיפיורי."},
 {t:"מונטיפיורי, שכבר שנים חלם להוציא את היהודים מהצפיפות והמחלות שבין החומות, רכש בכסף הזה שטח על הגבעה שמול העיר, וקרא לו \"כרם משה ויהודית\" — על שמו ועל שם אשתו. בהתחלה הוא בכלל תכנן להקים כאן בית חולים! אבל כשהבין שהמקום רחוק מדי מהעיר, שינה כיוון והחליט לבנות שכונה. בשנת 1860 הושלמה הבנייה: בית אבן ארוך במיוחד ובו שורת דירות, וכל משפחה קיבלה שני חדרים, מטבח, ואפילו שירותים פרטיים קטנים מחוץ לדירה — מותרות של ממש לעומת הצפיפות שבעיר העתיקה. חשמל ומים זורמים עוד לא היו: מנורות נפט האירו את הבתים, ומים שאבו משני בורות שבחצר."},
 {t:"אבל הייתה בעיה אחת גדולה: אנשים פחדו לגור בה! למרות הדירות החדשות והנקיות, שהיו טובות לאין ערוך מהבתים שבעיר העתיקה, הפחד מהשודדים היה חזק יותר. מספרים שחלק מהדיירים הראשונים קיבלו תשלום מיוחד רק כדי שיסכימו לישון בשכונה בלילה — וחלקם היו מתגנבים בערב בחזרה אל תוך החומות, וחוזרים לדירתם רק עם אור הבוקר! היום, כשדירה כאן שווה מיליונים, הסיפור הזה נשמע כמו בדיחה."},
 {t:"תסתכלו על הגג של המבנה: רואים את השיניות, כמו של חומת מבצר? זה לא קישוט. השיניות נבנו בכוונה, כדי שהדיירים ירגישו מוגנים — שכונה שנראית בעצמה כמו מבצר קטן. ומאיפה השם היפה \"משכנות שאננים\"? מפסוק בספר ישעיהו: \"וְיָשַׁב עַמִּי בִּנְוֵה שָׁלוֹם וּבְמִשְׁכְּנוֹת מִבְטַחִים וּבִמְנוּחֹת שַׁאֲנַנּוֹת\". \"שאננים\" פירושו שלווים ורגועים — בדיוק ההרגשה שמונטיפיורי רצה להעניק לדיירים, למרות הפחד שבחוץ."},
 {t:"עכשיו משימת בילוש על המבנה עצמו: הרימו מבט אל הדלתות — מעל כל דלת חקוקה אות עברית: א', ב', ג'... אלה היו \"מספרי הדירות\" של המשפחות! בשתי הדירות שבקצה פעלו בתי הכנסת הראשונים של השכונה. ובדירות ד'–ה' גרה משפחת קירשנבאום — משפחתו של אברהם מיכאל, גיבור ימין משה שהכרתם בתחנות הקודמות. ועוד אתגר: חפשו במרכז המבנה את כתובת האבן המקורית משנת 1860, שמספרת שהשכונה נוסדה מכספי העיזבון של יהודה טורא מניו אורלינס. היא שם כבר יותר מ-165 שנה."},
 {t:"והאומץ של הדיירים הראשונים השתלם, ועוד איך: כשראו תושבי העיר שאפשר לגור בחוץ ולשרוד, נשבר מחסום הפחד. אחרי משכנות שאננים קמו נחלת שבעה, מאה שערים, ימין משה ועוד עשרות שכונות — וירושלים פרצה מהחומות לכל הכיוונים. העיר הגדולה שאתם מכירים היום, על כל שכונותיה, התחילה כאן, בבית הארוך הזה שלמרגלות הטחנה. כל עיר צריכה מישהו שמעז ראשון."},
 {t:"והיום? גלגול מפתיע: המתחם המשופץ משמש מרכז תרבות, מרכז מוזיקה ובית הארחה יוקרתי, שאירח לאורך השנים סופרים, מוזיקאים ואמנים דגולים מכל העולם — כולל זוכי פרס נובל. האמנים באים לכתוב וליצור דווקא כאן, בגלל הנוף והשקט. מסתבר שמונטיפיורי צדק פעמיים: גם במקום, וגם בשם — \"משכנות שאננים\", משכן של שלווה. חפשו את השלט עם שם השכונה, ותצלמו!"}
 ],

 wiki:[
 {t:"איך נסעו בארץ ישראל לפני 150 שנה? לאט. מאוד לאט. לא היו מכוניות, לא רכבות ולא כבישים סלולים — רק דרכי עפר מאובקות, מלאות אבנים ובורות. נסיעה מנמל יפו לירושלים, שהיום אורכת פחות משעה, נמשכה אז יום שלם ולפעמים יותר, בטלטולים בלתי פוסקים ובעליות תלולות. בקיץ — אבק וחום כבד; בחורף — בוץ שבולע גלגלים. ובדרכים ארבו גם שודדים, ולכן העדיפו לנסוע בשיירות גדולות ורק לאור יום."},
 {t:"כלי הרכב המכובד ביותר של התקופה היה הכרכרה: תא נוסעים מעץ על גלגלים גדולים, רתום לצמד סוסים או יותר, עם עגלון שיושב מקדימה ומחזיק במושכות. קפיצי פלדה גדולים ניסו לרכך את הטלטולים (לא תמיד בהצלחה), פנסים עם נרות האירו את הדרך בערב, ובתא היו מושבים מרופדים. בכרכרה מפוארת כמו זו שלפניכם נסעו משה ויהודית מונטיפיורי במסעותיהם באירופה; לדרכי העפר המשובשות של ארץ ישראל היא הייתה עדינה מדי, וכאן נסעו בכרכרות מסע פשוטות וחזקות יותר — לירושלים, לחברון, לצפת ולטבריה."},
 {t:"מסע של מונטיפיורי לא היה טיול פשוט אלא משלחת שלמה: הוא נסע עם אשתו יהודית, עם רופא, עם מזכירים ומלווים — וגם עם שוחט, כדי שיהיה אוכל כשר בדרכים. בכל מקום שאליו הגיע קיבלו את פניו בהתרגשות עצומה: הוא היה האורח המפורסם ביותר שהגיע לארץ באותן שנים. הוא נפגש עם ראשי הקהילות, הקשיב לצרות ולבקשות, חילק תרומות — ואפילו ערך מפקדי אוכלוסין מסודרים של יהודי הארץ, שמשמשים חוקרים עד היום."},
 {t:"ומספרים שבכל עיר ועיירה רצו אחרי הכרכרה ילדים צוהלים — ומונטיפיורי, שלא היו לו ילדים משלו, נהג לפזר להם מטבעות מהחלון. תארו לעצמכם את התמונה: שיירה מפוארת מתקרבת בענן אבק, סוסים, מלווים, וילדי ירושלים רצים אחריה ברחובות הצרים. בשביל ילד ירושלמי של אז, יום שבו הגיע מונטיפיורי היה כמו חג."},
 {t:"בשנות ה-70 של המאה ה-20 הועלתה הכרכרה לארץ, והוצבה כאן למרגלות הטחנה — אנדרטה ניידת שמזכירה לכולם: האיש הזה לא שלח רק כסף מרחוק, הוא בא בעצמו שבע פעמים. ועכשיו משימת בילוש: חפשו על הכרכרה את סמל משפחת מונטיפיורי (רמז: הוא מופיע גם מעל הכניסה לטחנה!). בסמל — אריה וצבי שאוחזים מגינים, עצי דקל, מגיני דוד, ודגל קטן שעליו מילה אחת: \"ירושלים\". אריה — סמל עם ישראל, וצבי — סמל ארץ הצבי. ועל מונטיפיורי אף נכתב שיר ישראלי אהוב, \"וכל הכבוד לשר!\" — שמעו אותו בסרטון שלמטה ולמדו את הפזמון."},
 {t:"ואז, בלילה אחד בשנת 1986, קרה דבר עצוב: אלמוני התגנב לכאן והצית את הכרכרה. האש כילתה את כל חלקי העץ והבד היפים, ומהכרכרה ההיסטורית נשארה רק שלדת מתכת שרופה ושחורה. ירושלים כולה התאבלה על האובדן — אבל לא ויתרה."},
 {t:"האומן איתמר נוימן קיבל על עצמו משימה כמעט בלתי אפשרית: לשחזר את הכרכרה בדיוק כפי שהייתה. הוא עבד לפי תמונות ישנות, למד איך בנו כרכרות במאה ה-19, והשתמש במוטות הברזל המקוריים ששרדו את השריפה. העבודה הקפדנית ארכה שנים, ובשנת 1990 חזרה הכרכרה המשוחזרת למקומה, יפה כמו ביום הראשון. ומאז היא שמורה מאחורי זכוכית מגן חזקה במיוחד — כדי שאיש לא יוכל לפגוע בה שוב."},
 {t:"תתקרבו לזכוכית והסתכלו על הפרטים הקטנים: הגלגלים עם החישורים מעץ, הפנסים, הקפיצים הגדולים, המדרגה הקטנה לטיפוס פנימה. עכשיו חשבו רגע: נסיעה של יום שלם בקופסה הזאת, בחום של קיץ, בלי מזגן, בלי מסכים, בלי כוס מים קרים — ומונטיפיורי עשה את זה גם בגיל 90. מי מכם היה מחזיק מעמד? ומה הייתם לוקחים איתכם לדרך?"}

 {t:"כדי להבין את הטחנה, צריך קודם להכיר את האיש. משה מונטיפיורי נולד בשנת 1784 בעיר ליבורנו שבאיטליה — לגמרי במקרה: משפחתו היהודית-ספרדית גרה בלונדון, ורק באה לביקור בעיר מולדת הסבא. הוא גדל בלונדון, התחיל לעבוד כפקיד, ובגיל צעיר הפך לאחד מסוחרי הבורסה המצליחים בעיר. בשנת 1837 העניקה לו המלכה ויקטוריה תואר אצולה — \"סר\" — והוא נעשה לאחד היהודים המפורסמים והמכובדים בעולם כולו."},
 {t:"אבל בשיא הצלחתו החליט מונטיפיורי שכסף הוא לא המטרה — הוא הכלי. הוא הקדיש את חייו לעזרה ליהודים בכל מקום שבו נרדפו, ונסע למענם עד קצות העולם. לארץ ישראל הגיע שבע פעמים יחד עם אשתו האהובה יהודית, בין 1827 ל-1875 — וכל מסע כזה ארך שבועות בספינות מיטלטלות ובדרכים משובשות. את הביקור האחרון עשה בגיל 91! הוא גם היה היהודי הראשון בעת החדשה שקנה פרדס בארץ ישראל, עוד בשנת 1841."},
 {t:"ירושלים של אותם ימים הייתה עיר קטנה וצפופה, דחוסה כולה בין החומות. העוני היה נורא, מחלות התפשטו במהירות, והלחם — המזון הבסיסי ביותר — היה יקר, כי טחינת הקמח הייתה בידי טוחנים מקומיים שגבו מחירים גבוהים. מונטיפיורי, איש מעשה, החליט לתקוף את הבעיה מהשורש: אם הקמח יקר — נבנה טחנה משלנו, שתטחן לעניי ירושלים קמח בזול ותיתן פרנסה למתיישבים."},
 {t:"איך בונים טחנת רוח אנגלית בירושלים של האימפריה העות'מאנית? בהזמנה מיוחדת! את הטחנה תכננה חברת הולמן מהעיר קנטרברי שבאנגליה, לפי דגם של טחנת רוח אמיתית מהעיר רמסגייט — עיר מגוריו של מונטיפיורי. מגדל האבן נבנה כאן מאבן ירושלמית מקומית, אבל כל הציוד — גלגלי השיניים, אבני הריחיים, המנגנונים — הפליג באונייה מאנגליה עד נמל יפו, ומשם... נישא לירושלים על גבי גמלים! שיירת גמלים שסוחבת חלקים של טחנת רוח אנגלית במעלה ההרים — תמונה ששווה לדמיין."},
 {t:"והנה היא לפניכם: מגדל בגובה כ-18 מטרים — כמו בניין של שש קומות. למעלה יושבת כיפת עץ מיוחדת בצורת קרון (\"דגם קנט\"), שיודעת להסתובב לכיוון הרוח בעזרת מנגנון שבשבת חכם, כדי שארבע הכנפיים יתפסו תמיד את הרוח במלואה. הטחנה, שהושלמה ב-1858, הייתה המבנה הראשון שבנו יהודים מחוץ לחומות ירושלים — עוד לפני השכונה עצמה! באנגליה קראו לה בכבוד \"טחנת שער יפו\"."},
 {t:"הטחנה טחנה קמח כ-16 שנה, ובזכותה תושבי השכונה התפרנסו בכוחות עצמם — דבר נדיר בירושלים של אז, שרוב תושביה חיו מכספי תרומות. אפילו הסופר ש\"י עגנון, חתן פרס נובל, הזכיר את הטחנה ואת אבני הריחיים שלה בספרו \"תמול שלשום\". אבל בשנת 1876 קרתה תקלה: מנגנון הטחינה התקלקל, ובכל ירושלים לא נמצא אדם אחד שידע לתקן אותו! בדיוק באותה תקופה נפתחה במושבה הגרמנית הסמוכה טחנת קמח מונעת בקיטור — והטחנה הוותיקה יצאה לגמלאות."},
 {t:"ואז הגיעה מלחמת העצמאות, והטחנה השקטה גויסה לקרב: לוחמי ההגנה הקימו בראשה עמדת תצפית. הבריטים, ששלטו אז בעיר, הורו להשמיד את הטחנה כולה — ואז קרה נס קטן ומוזר: החיילים שנשלחו למשימה היו במקרה בני העיירה רמסגייט שבאנגליה, עיר מגוריו של מונטיפיורי! כשראו את שם העיר שלהם על שלט הטחנה, החליטו לחוס עליה — ופוצצו רק את העמדה שבראש, והמגדל ניצל. את המבצע ההוא כינו בצחוק \"מבצע דון קישוט\", על שם האביר מהספרים שנלחם בטחנות רוח כי חשב שהן ענקים."},
 {t:"עשרות שנים עמדה הטחנה בלי כיפה אמיתית, עד שבשנת 2012 הגיעו מומחים מהולנד — ארץ טחנות הרוח — והחזירו אותה לחיים: כיפת עץ חדשה, כנפיים חדשות, ומנגנון שמסתובב באמת כשנושבת רוח. היום שוכן בתוכה מוזיאון קטן על מונטיפיורי, שחי עד גיל 100 בדיוק — וביום הולדתו המאה חגגו יהודים בכל רחבי העולם. הרימו את הראש: אולי בדיוק עכשיו נושבת רוח והכנפיים זזות?"}

 wiki:[
 {t:"לפני יותר מ-2,000 שנה שלט כאן המלך הורדוס — אחד המלכים המפורסמים, המוכשרים והמוזרים בהיסטוריה של ארץ ישראל. הוא מלך על יהודה 33 שנה, אבל לא היה מלך עצמאי לגמרי: מעליו עמדה האימפריה החזקה בעולם — רומא. הרומאים נתנו לו לנהל את ענייני הממלכה בפנים, אבל בכל מה שנגע למלחמות ולמדיניות חוץ הוא היה חייב לציית להם. ההיסטוריה שלו מוכרת לנו בעיקר בזכות ההיסטוריון יוסף בן מתתיהו, שכתב עליו ספרים שלמים — כולל דברים שהורדוס בטח היה מעדיף שלא נדע."},
 {t:"למה קוראים לו \"המלך הבנאי\"? כי הורדוס פשוט לא הפסיק לבנות, ובקנה מידה שקשה לדמיין גם היום. הוא בנה מחדש את בית המקדש בירושלים והפך אותו לאחד המבנים המפוארים בעולם העתיק — חכמינו אמרו: \"מי שלא ראה בניין הורדוס — לא ראה בניין נאה מימיו\". הוא הקים את עיר הנמל קיסריה עם נמל ענק בלב הים ואמפיתיאטרון מהראשונים בעולם, בנה את ארמון המבצר על פסגת מצדה, ואפילו בנה לעצמו הר מלאכותי שלם — ההרודיון — עם ארמון על הפסגה."},
 {t:"אבל להורדוס היה גם צד אפל. הוא היה חשדן נורא, ופחד כל חייו שמישהו — אפילו מבני משפחתו — ינסה לגנוב לו את הכיסא. הפחד הזה גרם לו לעשות מעשים איומים גם לקרובים אליו ביותר. ככה זה כשמלך גדול חי בפחד גדול: הוא השאיר אחריו בניינים מפוארים שמרשימים אותנו עד היום, אבל גם סיפורים קשים שמלמדים שכוח בלי שקט נפשי הוא לא מתנה אלא עונש."},
 {t:"איך קברו מלכים ועשירים בימים ההם? לא בבית קברות רגיל. משפחות מכובדות חצבו בסלע מערות קבורה שלמות — עם חדרים, כוכים וארונות אבן מגולפים שנקראים סרקופגים. ואת הכניסה סגרו בפטנט מבריק: אבן ענקית ועגולה כמו גלגל, שנקראת \"אבן גולל\", שמתגלגלת בתוך תעלה חצובה. כדי להזיז אותה נדרשו כמה אנשים חזקים ביחד — וכך המערה הייתה מוגנת מפני חיות רעות ומפני שודדי קברים שחיפשו זהב ותכשיטים."},
 {t:"בשנת 1891 גילו כאן חוקרים מערת קבורה מפוארת במיוחד: חצר חצובה בסלע, פתח נמוך, אבן גולל ענקית במקומה — ובפנים סרקופגים מעוטרים ויפים להפליא. ההתרגשות הייתה עצומה. יוסף בן מתתיהו כתב שקבר משפחתו של הורדוס נמצא בדיוק באזור הזה של העיר, ולכן החוקרים משערים שכאן נטמנו בני משפחת המלך. אגב, הסרקופגים שנמצאו כאן היו מהיפים שנמצאו אי פעם בירושלים."},
 {t:"והורדוס עצמו? הוא לא נקבר כאן. על פי יוסף בן מתתיהו, הוא נקבר בהרודיון — ההר המלאכותי שבנה ליד בית לחם — במסע הלוויה מפואר עם חיילים, בשמים וזהב. אבל איפה בדיוק בהרודיון? את החידה הזאת ניסה לפתור הארכיאולוג אהוד נצר, שחפר וחיפש את הקבר במשך כ-35 שנה. ורק בשנת 2007 — אחרי חיים שלמים של חיפוש — הוא מצא סוף סוף את שרידי הקבר על מדרון ההר. לפעמים עקשנות היא כלי המחקר החשוב ביותר."},
 {t:"עכשיו הסתכלו טוב על המקום: החצר החצובה, הפתח הנמוך, האבן העגולה הענקית. שימו לב כמה הפתח קטן — זה בכוונה! פתח נמוך קשה לפריצה, וכל מי שנכנס חייב להתכופף. האבן שלפניכם היא אחת מאבני הגולל הבודדות בירושלים שנשארו במקומן המקורי. תחשבו כמה היא שוקלת, ונסו לנחש: כמה ילדים כמוכם היו צריכים כדי להזיז אותה?"},
 {t:"עצמו רגע עיניים ודמיינו: לפני 2,000 שנה עמדה כאן תהלוכת אבל מלכותית — חיילים בשריון, משרתים, בני מלוכה בבגדים יקרים, אולי גם מקוננות שבכו בקול. את הארון הכניסו פנימה לאור לפידים, גלגלו את האבן הגדולה על הפתח... ושקט. במשך כמעט 2,000 שנה אף אחד לא ידע שהמערה כאן — עד שהתגלתה מחדש, בדיוק במקום שבו אתם עומדים עכשיו בנעלי ספורט."}

      ${miniMap(S.st)}
      <button class="btn ghost" onclick="document.getElementById('dirs').style.display='block';this.style.display='none';">🧭 עדיין מתלבטים? הוראות הגעה מדויקות</button>
      <div class="hintbox" id="dirs">🚶 ${dirsTxt}</div>
      <a class="maplink" href="${st.map}" target="_blank" rel="noopener">🗺️ גלגל הצלה אחרון: פתיחת מפה אמיתית</a>
      <button class="btn" onclick="S.phase='wiki';save();render();window.scrollTo(0,0);">✅ מצאנו! הגענו לתחנה</button>
    </div>`));
    return;
  }

  if(S.phase==='wiki'){
    const R=readers();
    const before=route().slice(0,S.st).reduce((a,ix)=>a+STATIONS[ix].wiki.length,0);
    const paras = st.wiki.map((p,j)=>{
      const ri=(before+j)%R.length;
      return `<div class="wpara"><span class="reader r${ri%4}">📖 ${R[ri]} מקריא/ה</span><p>${p.t}</p></div>`;
    }).join('');
    const intro = st.intro ? `<p style="font-size:.95em;"><i>${st.intro}</i></p>` : '';
    const photos = (st.photos||[]).map(p=>`<figure style="margin:12px 0 4px;"><img src="${p.src}" alt="" style="width:100%;border-radius:10px;display:block;" loading="lazy" onerror="this.parentElement.style.display='none'"><figcaption style="font-size:.8em;color:#7a6a52;text-align:center;margin-top:3px;">${p.cap}</figcaption></figure>`).join('');
    const vids = (st.videos||[]).map(v=>`<div class="vid" id="vid-${v.id}"><div class="vidthumb" onclick="loadVid('${v.id}')"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy"><span class="vplay">▶</span></div><div class="vidcap">🎬 ${v.cap}</div></div>`).join('');
    app.appendChild(el(head+`
      <div class="wikibox">
        <div class="wtag">${st.wikiTag||'📖 מיני-ויקיפדיה של המסע'}</div>
        <h3>${st.wikiTitle}</h3>
        ${intro}
        ${photos}
        ${paras}
        ${vids}
        <div class="funfact">${st.fun}</div>
      </div>
      <p style="font-size:.9em; margin-top:10px;">👆 כל אחד מקריא בקול את הפסקה שלו — השאלות הבאות מסתתרות בתוך הערך ובשטח!</p>
      <button class="btn" onclick="S.phase='q1';save();render();window.scrollTo(0,0);">📚 קראנו הכול! לשאלות</button>
    </div>`));
    return;
  }

  if(S.phase[0]==='q'){
    const qi=parseInt(S.phase.slice(1))-1;
    const q = st.qs[qi];
    const tag = q.type==='r' ? '<span class="tag wiki">❓ שאלה '+(qi+1)+' מתוך 4 — התשובה בערך!</span>' : '<span class="tag field">👀 שאלה '+(qi+1)+' מתוך 4 — תסתכלו סביב!</span>';
    let body=head+tag+`<p style="margin:8px 0 0;"><b>${q.q}</b></p>`;
    if(q.input){
      body+=`<input type="text" id="ans" inputmode="text" placeholder="התשובה שלכם">
             <button class="btn" onclick="checkInput()">בדיקה</button>`;
    } else {
      q.opts.forEach((o,i)=>{ body+=`<button class="opt" id="opt${i}" onclick="checkOpt(${i})">${o}</button>`; });
    }
    body+=`<div class="msg" id="msg"></div>
      <button class="btn ghost" onclick="document.getElementById('hint').style.display='block'">💡 רמז</button>
      <div class="hintbox" id="hint">💡 ${q.hint}</div>
      <button class="btn ghost" onclick="S.phase='wiki';save();render();">📖 חזרה לערך</button>
    </div>`;
    app.appendChild(el(body));
    return;
  }

  if(S.phase==='bonus'){
    const key='b'+S.st;
    app.appendChild(el(head+`
      <div class="msg ok">🎉 כל הכבוד! פתרתם את תחנת ${st.name}!</div>
      <div class="bonus">
        <label><input type="checkbox" id="bchk" ${S.bonus[key]?'checked':''} onchange="toggleBonus('${key}')">
        <span>${st.bonus}<br><small>סמנו ✔ רק אחרי שביצעתם באמת (אמא שופטת ראשית!)</small></span></label>
      </div>
      <button class="btn gold" onclick="nextStation()">${S.st<STATIONS.length-1 ? '🧭 לחידת הדרך הבאה!' : '🏆 לסיום המסע!'}</button>
    </div>`));
    return;
  }
}

function award(base){
  const key=S.phase+'-'+S.st;
  const tries=S.tries[key]||0;
  return Math.max(base-3*tries, 4);
}
function markTry(){ const key=S.phase+'-'+S.st; S.tries[key]=(S.tries[key]||0)+1; }

function checkOpt(i){
  const st=STATIONS[route()[S.st]], qi=parseInt(S.phase.slice(1))-1, q=st.qs[qi];
  const msg=document.getElementById('msg');
  if(i===q.right){
    document.getElementById('opt'+i).classList.add('right');
    S.score+=award(10);
    msg.className='msg ok'; msg.textContent='נכון! ⭐';
    setTimeout(()=>{ S.phase = qi<3 ? 'q'+(qi+2) : 'bonus'; save(); render(); window.scrollTo(0,0); },700);
  } else {
    document.getElementById('opt'+i).classList.add('wrong');
    markTry(); msg.className='msg no'; msg.textContent='לא בדיוק... נסו שוב! (אפשר להציץ שוב בערך)';
  }
  save(); renderHeader();
}
function checkInput(){
  const st=STATIONS[route()[S.st]], qi=parseInt(S.phase.slice(1))-1, q=st.qs[qi];
  const v=norm(document.getElementById('ans').value);
  const msg=document.getElementById('msg');
  if(q.answer.some(a=>norm(a)===v)){
    S.score+=award(10);
    msg.className='msg ok'; msg.textContent='נכון! ⭐';
    setTimeout(()=>{ S.phase = qi<3 ? 'q'+(qi+2) : 'bonus'; save(); render(); window.scrollTo(0,0); },700);
  } else {
    markTry(); msg.className='msg no'; msg.textContent='לא בדיוק... תסתכלו שוב ונסו שנית!';
  }
  save(); renderHeader();
}
function toggleBonus(key){
  const chk=document.getElementById('bchk');
  if(chk.checked && !S.bonus[key]){ S.bonus[key]=true; S.score+=15; }
  else if(!chk.checked && S.bonus[key]){ delete S.bonus[key]; S.score-=15; }
  save(); renderHeader();
}
function nextStation(){
  if(S.st<STATIONS.length-1){ S.st++; S.phase='riddle'; }
  else { S.done=true; }
  save(); render(); window.scrollTo(0,0);
  if(S.done) confetti();
}

function renderEnd(){
  const rank=[...RANKS].reverse().find(r=>S.score>=r.min);
  app.appendChild(el(`
  <div class="card cert">
    <div style="font-size:2.2em;">🏆</div>
    <h2>תעודת סיום המסע</h2>
    <p>מוענקת בזאת ל:</p>
    <div class="names"><b>${S.names||'החוקרים האמיצים'}</b></div>
    <p style="font-size:1.1em;">${TEAMS[S.team]||''}</p>
    <p>על שהשלימו בהצלחה את כל 10 התחנות<br><b>המסע בעקבות מונטיפיורי</b><br>ממשכנות שאננים וימין משה ועד בית טאנוס —<br>המקום שבו לחם סבא רבא במלחמת העצמאות</p>
    <div class="rank">${rank.name}</div>
    <p>⭐ ${S.score} נקודות</p>
    <p style="font-size:.9em;">ירושלים, ${new Date().toLocaleDateString('he-IL')}</p>
  </div>
  <div class="card">
    <h2>🎁 ורגע... המטמון?</h2>
    <p>מונטיפיורי תמיד דאג לתת לאחרים. עכשיו תורכם לקבל: <b>גשו למלווה שלכם ותגידו את המשפט הסודי —</b></p>
    <div class="riddle">"אנחנו יורשי מונטיפיורי, ובאנו לקבל את המטמון!"</div>
    <p style="font-size:.9em;">(למלווה יש הוראות סודיות משלו 😉)</p>
    <button class="btn ghost" onclick="if(confirm('להתחיל משחק חדש? הניקוד יימחק.')){localStorage.removeItem('montegame');location.reload();}">🔄 משחק חדש</button>
  </div>`));
}

/* ---------- אזור מלווה ---------- */
function parentGate(){
  const c=prompt('אזור המלווה 🔑\nהקלידו את הקוד (רמז: השנה שבה נפטר מונטיפיורי בגיל 100... 1785+100):');
  if(c===PARENT_CODE){ S.screen='parent'; render(); window.scrollTo(0,0); }
  else if(c!==null) alert('קוד שגוי');
}
function backFromParent(){ S.screen = S.names||S.st>0 ? 'game' : 'intro'; render(); }
function saveSyncUrl(){
  const v=document.getElementById('syncin').value.trim();
  if(v){ localStorage.setItem('montesyncurl', v); alert('נשמר! הסנכרון פעיל.'); }
  else { localStorage.removeItem('montesyncurl'); alert('הכתובת נמחקה.'); }
  render();
}
function renderParent(){
  let keys='';
  STATIONS.forEach((st,i)=>{
    const ans = st.qs.map((q,j)=>(j+1)+') '+(q.input?q.answer[0]:q.opts[q.right])).join(' · ');
    keys+=`<p>${st.emoji} <b>${st.name}</b><br><b>${ans}</b></p>`;
  });
  const su=syncUrl();
  app.appendChild(el(`
  <div class="parent">
  <div class="card">
    <h2>🔑 אזור המלווה</h2>
    <h3>לפני היציאה</h3>
    <p>⏱️ משך משוער: 2–2.5 שעות הליכה נינוחה (10 תחנות) · 🥤 מים וכובעים (אין הרבה צל בין התחנות) · 🔋 טלפונים טעונים · 🎁 <b>להחביא/להכין פרס-מטמון</b> — מומלץ גלידה בסינמטק או הפתעה קטנה בתיק. כשהילדים אומרים בסוף את "המשפט הסודי" — מגישים את המטמון.</p>
    <h3>תיאומים שווים לדעת</h3>
    <p>🕍 בית הכנסת הספרדי פתוח בעיקר בימי שני וחמישי 8:00–11:00, שישי בערב ושבת בבוקר — מומלץ לתאם מראש (משה: 054-5930818). 🌬️ פנים הטחנה (המוזיאון הקטן) פתוח רק בתקופות מסוימות. שימו לב: רחבת הטחנה עמוסה קבוצות תלמידים בשעות הבוקר ברוב ימות השבוע.</p>
    <h3>חלוקת קריאה</h3>
    <p>ההקראה מתחלקת אוטומטית בין השמות שהוזנו במסך הפתיחה (מופרדים בפסיקים), בסבב הוגן שנמשך לאורך כל המשחק — כך שכולם מקריאים כמות דומה של פסקאות. אם לא הוזנו שמות, החלוקה היא בין רבקה, טליה, שמואל ושניאור.</p>
    <h3>המסלול בקצרה</h3>
    <p>שתי הקבוצות יוצאות יחד ממזרקת האריות (הפינה הדרומית של גן בלומפילד, מול גן הפעמון), עוברות בסוף דרך קבר משפחת הורדוס (תחנה 9 משותפת), ומסיימות בשלט בית טאנוס בשער המזרחי של כפר דוד שבממילא — התחנה של סבא רבא. ההבדל בתחנות 2–8: <b>🦁 קבוצת האריה</b>: בריכת הסולטן → בית הכנסת הספרדי → סמטאות ימין משה → תצפית החומות → הבית הארוך → הכרכרה → הטחנה. <b>🦌 קבוצת הצבי</b>: הטחנה → הכרכרה → הבית הארוך → תצפית החומות → סמטאות ימין משה → בית הכנסת הספרדי → בריכת הסולטן. הקבוצות ייפגשו בערך באמצע — מותר להגיד שלום, אסור לגלות תשובות! 😉 מנצחת הקבוצה שמסיימת עם יותר נקודות (או שמגיעה ראשונה לבית טאנוס — תחליטו מראש). לכל טלפון קוד קבוצה משלו למעקב מרחוק. גלידה חגיגית לכולם בממילא!</p>
    <h3>👀 מעקב מכמה טלפונים</h3>
    <p>קוד הקבוצה של המשחק הזה: <span class="roomcode">${S.room||'ייווצר ביציאה לדרך'}</span></p>
    <p style="font-size:.9em;">טלפון שרוצה לצפות בהתקדמות: פותח את אותה כתובת, לוחץ למטה על "👀 מעקב מרחוק" ומזין את קוד הקבוצה. <b>דרוש שרת סנכרון</b> (Apps Script) — ${su?'✅ מוגדר ופעיל':'⚠️ עדיין לא הוגדר'}.</p>
    <input type="text" id="syncin" placeholder="הדביקו כאן את כתובת ה-Apps Script" value="${localStorage.getItem('montesyncurl')||''}">
    <button class="btn ghost" onclick="saveSyncUrl()">שמירת כתובת סנכרון</button>
    <h3>תשובות (לחירום בלבד 😉)</h3>
    <div class="anskey">${keys}</div>
    <h3>תקלות</h3>
    <p>המשחק נשמר אוטומטית בטלפון — אפשר לסגור ולפתוח את הדפדפן. "איפוס" בתחתית הדף מוחק הכול.</p>
    <button class="btn" onclick="backFromParent()">חזרה למשחק</button>
  </div></div>`));
}

/* ---------- מצב מעקב מרחוק ---------- */
let watchTimer=null;
function renderWatch(){
  document.querySelector('header.game .sub').textContent='מצב מעקב מרחוק 👀';
  app.innerHTML='';
  const su=syncUrl();
  app.appendChild(el(`
  <div class="card">
    <h2>👀 מעקב אחרי הקבוצה</h2>
    ${su?'':'<div class="watchbar">⚠️ לא הוגדרה כתובת סנכרון. הדביקו אותה כאן:<input type="text" id="wsync" placeholder="כתובת ה-Apps Script" value=""><button class="btn ghost" onclick="localStorage.setItem(\'montesyncurl\',document.getElementById(\'wsync\').value.trim());renderWatch();">שמירה</button></div>'}
    <p>הזינו את קוד הקבוצה (מופיע בתחתית המסך בטלפון המשחק):</p>
    <input type="text" id="wroom" inputmode="numeric" placeholder="למשל 4271" value="${localStorage.getItem('montewatchroom')||''}">
    <button class="btn gold" onclick="startWatch()">התחלת מעקב</button>
    <div id="wstatus"></div>
  </div>`));
}
function startWatch(){
  const room=document.getElementById('wroom').value.trim();
  if(!room) return;
  localStorage.setItem('montewatchroom', room);
  if(watchTimer) clearInterval(watchTimer);
  pollWatch(room);
  watchTimer=setInterval(()=>pollWatch(room), 15000);
}
function pollWatch(room){
  const u=syncUrl(); const box=document.getElementById('wstatus');
  if(!u){ box.innerHTML='<div class="watchbar">⚠️ אין כתובת סנכרון.</div>'; return; }
  fetch(u+'?room='+encodeURIComponent(room)+'&nc='+Date.now())
   .then(r=>r.json())
   .then(d=>{
      if(!d||!d.t){ box.innerHTML='<div class="watchbar">עוד אין נתונים לקבוצה '+room+'. ודאו שהמשחק התחיל ושקוד הקבוצה נכון.</div>'; return; }
      const rt=ROUTES[d.team]||ROUTES.A;
      const st=Math.min(d.st,rt.length-1);
      const name=d.done?'🏆 סיימו את המסע!':STATIONS[rt[st]].name;
      const phases={riddle:'🧭 מנווטים אל התחנה',wiki:'📖 קוראים את הערך',q1:'❓ שאלה 1 מתוך 4',q2:'❓ שאלה 2 מתוך 4',q3:'👀 שאלה 3 מתוך 4',q4:'👀 שאלה 4 מתוך 4',bonus:'📸 במשימת הבונוס'};
      const ago=Math.max(0,Math.round((Date.now()-d.t)/60000));
      box.innerHTML=`<div class="watchbar">
        <b>${d.team?(TEAMS[d.team]||''):''} ${d.names||''}</b><br>
        📍 תחנה ${d.done?rt.length:st+1}/${rt.length}: <b>${name}</b><br>
        ${d.done?'':phases[d.phase]||''}<br>
        ⭐ ${d.score} נקודות · עודכן לפני ${ago<1?'פחות מדקה':ago+' דק\''}
      </div>`+miniMap(d.done?rt.length:st, rt);
   })
   .catch(()=>{ box.innerHTML='<div class="watchbar">שגיאת תקשורת — ננסה שוב בעוד רגע.</div>'; });
}

/* ---------- הפעלה ---------- */
if(new URLSearchParams(location.search).has('follow')){ renderWatch(); }
else render();
</script>
